# Minigame balance data.
# Schema: src/game/content/minigame_balance.py
# Contract: docs/minigame-system.md §5.1, §5.2

recovery_floor:
  audience_threshold: 35
  partial_audience_bonus: 2
  failure_audience_dampener: 2

compatibility_quiz:
  rounds: 5
  per_round_points:
    correct_tier1: 2
    correct_tier2: 3
    correct_tier3: 4
    correct_tier4: 5
    correct_flavor: 1
    incorrect: 0
  thresholds:
    success: 14
    partial: 8
  audience:
    # Bumped so the moment carries weight. Recovery floor (§5.2) still
    # softens failure for low-audience players: partial +2 bonus, failure
    # dampens up to zero. Even with bonus the swing reads as a real beat.
    success: 6
    partial: 2
    failure: -5
heart_rate:
  reaction_rounds: 1
  thresholds:
    surprise_chemistry: 70
  per_round_points:
    lean_in: 0
    play_cool: 0
    apologize: 0
  audience:
    success: 5         # surprise revealed AND player engaged
    partial: 2         # surprise on partner side, not player
    failure: -1        # flat week, no chemistry crests
    lean_in_bonus: 3
    apologize_penalty: -2

