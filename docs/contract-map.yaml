groups:
  - id: browser_api_contract
    paths:
      - src/api/**
      - web/**
      - vercel.json
    docs:
      - AGENTS.md
      - docs/phase3-fastapi-contract.md
      - docs/phase3-ui-spec.md
      - docs/decisions/0012-nextjs-thin-client-over-vite.md

  - id: balance_boundary
    paths:
      - data/balance/**
      - content/**
      - src/game/content/**
      - src/game/engine/intents.py
      - src/game/engine/challenges.py
    docs:
      - AGENTS.md
      - ENGINEERING.md
      - docs/decisions/0013-balance-data-boundary.md
      - docs/minigame-system.md
      - docs/minigames/README.md
      - docs/minigames/compatibility-quiz.md
      - docs/minigames/couples-quiz.md
      - docs/minigames/heart-rate.md
      - docs/minigames/lie-detector.md
      - docs/minigames/snog-marry-pie.md
      - docs/minigames/final-couples.md

  - id: checkpoint_replay_contract
    paths:
      - src/game/state/rng.py
      - src/game/state/snapshot.py
      - src/game/cli/commands/play.py
      - src/game/cli/commands/play_session.py
      - src/game/cli/commands/report_compare.py
    docs:
      - docs/qa-strategy.md
      - docs/decisions/0008-snapshot-and-trace-architecture.md

  - id: agent_prompt_contract
    paths:
      - src/game/agents/**
    docs:
      - ENGINEERING.md
      - docs/decisions/0014-agent-split-after-narrator-v0.md

  - id: qa_tooling
    paths:
      - Makefile
      - pyproject.toml
      - scripts/**
      - .githooks/**
      - .github/workflows/**
      - docs/contract-map.yaml
    docs:
      - AGENTS.md
      - docs/qa-strategy.md

  - id: llm_eval_system
    paths:
      - evals/llm/**
      - src/game/eval/golden_*.py
      - src/game/cli/commands/eval_llm.py
      - src/game/agents/runtime.py
    docs:
      - docs/llm-eval-system.md
      - docs/qa-strategy.md
      - evals/llm/scenarios/FORMAT.md

  - id: current_planning
    paths:
      - docs/current-plan.md
      - AGENTS.md
    docs:
      - AGENTS.md
      - docs/current-plan.md

  - id: core_gameplay_loop
    paths:
      - src/game/engine/turn.py
      - src/game/engine/turn_*.py
      - src/game/engine/phases.py
      - src/game/engine/time_budget.py
      - src/game/engine/ceremonies.py
      - src/game/engine/producer_events.py
      - src/game/engine/casa_amor.py
      - src/game/engine/final_vote.py
      - src/game/engine/proposals.py
      - src/game/engine/pull.py
      - src/game/engine/interruptions.py
      - src/game/engine/hideaway.py
      - src/game/engine/gather.py
    docs:
      - AGENTS.md
      - docs/current-plan.md
      - docs/qa-strategy.md
      - 08-Daily-Loop.md
      - 09-Social-Dynamics.md
      - 10-Elimination-System.md
      - 12-Challenges-And-Events.md

  - id: knowledge_foundation
    paths:
      - src/game/state/traits.py
      - src/game/engine/knowledge.py
      - src/game/engine/gossip.py
      - src/game/engine/heart_throb_brief.py
      - src/game/content/trait_library.py
      - src/game/content/curated_cast.json
      - src/game/agents/trait_generator.py
      - src/game/agents/prompts/trait_generator.md
    docs:
      - docs/phase5-0-knowledge-foundation.md
      - docs/current-plan.md
      - 07-Gossip-And-Information.md
      - 12-Challenges-And-Events.md

  - id: review_packet_tooling
    paths:
      - src/game/reporting/**
      - src/game/cli/commands/report.py
      - src/game/cli/commands/report_compare.py
      - src/game/cli/commands/review.py
      - src/game/cli/commands/play_session.py
      - src/game/state/bookmarks.py
      - src/game/engine/bookmarks.py
    docs:
      - docs/current-plan.md
      - docs/qa-strategy.md
      - docs/subagent-cli-playtest.md
