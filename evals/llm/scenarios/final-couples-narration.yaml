id: final-couples-narration
title: Final Couples Finale
question: Can the finale reflect the season without changing the score?
category: challenges
goal: Prove the narrator delivers a finale-length wrap that ties together knowledge, chemistry, honesty, banter, and audacity facets without re-scoring.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: finale_challenge_register
      criteria: >
        The narration feels like a season-closing challenge beat, connects at least three of the
        recorded knowledge, chemistry, honesty, banter, and audacity facets to the player's pick,
        and never changes the engine's classification or consequences.
seed: 808
initial_day: 6
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 6
    banter: 6
    eq: 7
    spark: 5
    loyalty: 6
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 65
    trust: 50
    friendship: 40
    chemistry: 70  # high band -> chemistry_high pts in the chemistry facet
  maya:
    affection: 25
    trust: 10
    friendship: 10
  blake:
    affection: 5  # rival pool for audacity facet
judge_context:
  - Final Couples is a weighted-sum minigame across 5 facets (knowledge=4, chemistry=3, honesty=5, banter=3, audacity=3 weights).
  - This is the finale. Narration should feel like a closing scene, naming at least three of the five facets and calling back to earlier days.
turns:
  - id: morning-to-finale
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: Day 6 morning ends. The finale stage is set; pending_challenge.kind == "final_couples"; 5
        rounds queued across knowledge / chemistry / honesty / banter / audacity facets.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The poolside challenge remains unresolved, with the Final Couples Challenge still pending.
            Chloe stays beside you as the camera holds on the couple, the silence between you carrying the
            entire moment.
    checks:
      - ceremony_events_present
  - id: knowledge-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 0 } }
    golden:
      criteria: Player nails the knowledge facet. Tier-dependent.
      calls: []
    checks: []
  - id: chemistry-kiss
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: chemistry_kiss, round_index: 1 } }
    golden:
      criteria: Player picks the kiss memory. Chemistry facet uses partner.relationship.chemistry — high band.
      calls: []
    checks: []
  - id: honesty-truth
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: truth, round_index: 2 } }
    golden:
      criteria: Player tells the truth.
      calls: []
    checks: []
  - id: banter-match
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: callback_inside_joke, round_index: 3 } }
    golden:
      criteria: Player picks the inside-joke callback.
      calls: []
    checks: []
  - id: audacity-callout-rival
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: callout_blake, round_index: 4 } }
    golden:
      criteria: 'Player pies the rival. Weighted sum lands in the success band. Classification: success. Audience
        +8. Partner deltas affection+8 trust+4. The narrator delivers a finale wrap that names at least three
        facets and calls back to a moment from earlier in the season.'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the finale, your knowledge of Chloe holds as you choose “twenty-six,” and the chemistry
            round lands on “The kiss after the Pairing Ceremony,” drawing a smile from her as your eyes meet.
            Honesty stays clear in your choice to tell Chloe the truth, while banter clicks with “The one
            only you two get,” and her warmth answers yours across the room. For audacity, you call out Blake,
            delivering the season’s sharpest read with Chloe watching beside you. The successful finish leaves
            your season-spanning story glowing from that defining kiss to this final stand.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
  - id: post-final-wrap-breath
    action: { kind: ambient, target_id: ambient_wait }
    golden:
      criteria: The resolved finale challenge leaves the playable surface after its wrap; the next turn should
        feel like forward resort pacing, not a replay of the challenge result.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: 'The call goes out across the pool: everyone is summoned to the Flame Deck for the final
            vote announcement. Chloe stays beside you, her attention fixed on you as the resort shifts from
            sunlit ease to waiting silence.'
    checks:
      - challenge_cleared
      - no_exchange
