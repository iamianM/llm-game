id: final-couples-narration
title: Final Couples Finale
question: Can the finale reflect the season without changing the score?
category: challenges
goal: Prove the narrator delivers a finale-length wrap that ties together knowledge, chemistry, honesty, banter, and audacity facets without re-scoring.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: finale_challenge_register
      criteria: >
        The wrap reports a successful finish and connects the player's recorded choice in all five
        facets to Chloe or the season. It must name the Pairing Ceremony kiss and Blake callout,
        preserve the engine-owned outcome, and avoid turning generic choice labels into invented
        memories. Points and relationship deltas belong in the adjacent engine result, not the prose.
seed: 808
initial_day: 6
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 6
    banter: 6
    eq: 7
    spark: 5
    loyalty: 6
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 65
    trust: 50
    friendship: 40
    chemistry: 70  # high band -> chemistry_high pts in the chemistry facet
  maya:
    affection: 25
    trust: 10
    friendship: 10
  blake:
    affection: 5  # rival pool for audacity facet
judge_context:
  - "Final Couples has five facets: knowledge, chemistry, honesty, banter, and audacity."
  - This is the finale. The completed narration must name all five facets and stay inside recorded choices.
turns:
  - id: morning-to-finale
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls: []
    checks:
      - ceremony_events_present
  - id: knowledge-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 0 } }
    golden:
      calls: []
    checks: []
  - id: chemistry-kiss
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: chemistry_kiss, round_index: 1 } }
    golden:
      calls: []
    checks: []
  - id: honesty-truth
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: truth, round_index: 2 } }
    golden:
      calls: []
    checks: []
  - id: banter-match
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: callback_inside_joke, round_index: 3 } }
    golden:
      calls: []
    checks: []
  - id: audacity-callout-rival
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: callout_blake, round_index: 4 } }
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: Knowledge lands on Chloe's recorded answer of twenty-six. For chemistry, the player
            chooses the kiss after the Pairing Ceremony; honesty gets the truthful answer, and banter
            gets the private callback without inventing what the joke was. The player uses audacity
            to call out Blake, completing a successful finish with Chloe.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
  - id: post-final-wrap-breath
    action: { kind: ambient, target_id: ambient_wait }
    golden:
      calls: []
    checks:
      - challenge_cleared
      - no_exchange
