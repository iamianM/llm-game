id: private-chat-rejection
title: Private Chat (Rejection)
question: Can a rejected private chat preserve the original conversation and deflection?
category: social_dynamics
goal: Prove a failed private chat keeps the original NPC-NPC conversation active, records a deflection memory, and the rejected exchange does not invent acceptance.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: private_chat_rejection_grounded
      criteria: >
        Maya's response is an in-character not-now that acknowledges she was already talking
        with Liam. The thread must not sound like a warm acceptance, invent private time, or act
        as though the player began with her full attention.
seed: 1515
initial_location: flame_deck
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  maya:
    affection: 10
    chemistry: 60
    friendship: 5
initial_npc_conversations:
  - id: npcconv_maya_liam_flame_deck
    participants:
      - maya
      - liam
    location_id: flame_deck
    topic: Maya pressing Liam about who he is actually watching this week
    started_on_turn: 0
    status: active
judge_context:
  - Maya is mid-conversation with Liam at the flame_deck, in front of the rest of the cast.
  - The private chat is engine-decided; the seed and stats are set so the invitation is rejected here.
  - On rejection the NPC-NPC conversation stays active, Maya deflects, and the exchange must not behave like a successful private chat.
turns:
  - id: try-private-chat-maya
    arrange_player_location: flame_deck
    arrange_npc_locations:
      maya: flame_deck
      liam: flame_deck
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_intimate_eye_contact
    golden:
      criteria: 'The player asks Maya for a private chat during the flame_deck chat and gets brushed off.
        Maya''s deflection should feel in character — a quick "not now", a glance back to Liam, maybe a soft
        "find me later" — and the original conversation between Maya and Liam should still be running. Imagine:
        "Babe, give me a minute — I''m in the middle of something. ...Come back when this lot have gone to
        bed."'
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: Sorry to interrupt, Maya, but can I steal you for a private chat? I wanted to pick
            up on what you were asking Liam.
          npc_dialogue: Steal me? Bold, considering I’m in the middle of a highly important Liam investigation
            and the suspect is refusing to crack. I can’t peel off right now—he’ll vanish into the crowd and
            become mysterious by accident.
          npc_tone: playful
          npc_mood_after: content
    checks:
      - private_chat_recorded
      - private_chat_rejected
      - npc_conversation_still_active
      - private_chat_rejection_witness_memory
      - exchange_valid
      - agent_traces_present
