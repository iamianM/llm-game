id: couples-quiz-narration
title: Couples Quiz Two-Sided Round
question: Can alternating quiz rounds name real mismatches without inventing scores?
category: challenges
goal: Prove the Event Narrator handles alternating player/partner rounds and names actual mismatches without inventing scoring.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: couples_quiz_arc_faithful
      criteria: >
        The full quiz reads as an alternating player/partner exercise and the wrap names the
        actual recorded mismatch rather than reducing the sequence to a generic score summary
        or inventing a different answer.
seed: 313
initial_day: 3
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 6
    spark: 5
    loyalty: 8
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 45
    trust: 30
    friendship: 25
judge_context:
  - The Couples Quiz alternates direction. Even rounds quiz the player about the partner. Odd rounds ask the player to guess what the partner guessed about THEM.
  - Match = 3 pts, mismatch = 0 pts. Three consecutive mismatches trigger a streak penalty.
  - Narration must name at least one specific mismatch or match by question text or answer.
turns:
  - id: morning-to-couples-quiz
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: Morning ends, the Couples Quiz scene begins. pending_challenge.kind == "couples_quiz". Six
        rounds queued, alternating between player-about-partner and partner-about-player.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the pool, the Couples Quiz remains pending, leaving the waterline charged with anticipation.
            Chloe stays beside you, her eyes fixed on you as the unresolved moment hangs between you both.
    checks:
      - ceremony_events_present
  - id: r1-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 0 } }
    golden:
      criteria: Player correctly answers about partner. Round 0.
      calls: []
    checks: []
  - id: r2-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 1 } }
    golden:
      criteria: Player correctly guesses partner's guess. Round 1.
      calls: []
    checks: []
  - id: r3-wrong
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: distractor_0, round_index: 2 } }
    golden:
      criteria: Player misreads partner trait. Round 2.
      calls: []
    checks: []
  - id: r4-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 3 } }
    golden:
      criteria: Player correctly guesses partner's guess. Round 3.
      calls: []
    checks: []
  - id: r5-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 4 } }
    golden:
      criteria: Player correctly answers about partner. Round 4.
      calls: []
    checks: []
  - id: r6-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 5 } }
    golden:
      criteria: Final round resolves. With 5 of 6 matches, the couple lands in success band; classification
        == success. Narrator dramatises the flow — the one mismatch in round 3, the partner's reactions —
        without inventing a different score.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: 'At the pool, the Couples Quiz ends in a partial result, and the warmth between you and Chloe
            tightens under the afternoon sun. You and Chloe match on her age and hometown, while you pick
            “Taskmaster clips watched under a blanket” instead of “Gavin and Stacey” for her comfort show.
            Chloe’s booth answers also land cleanly: she has written “the Heartthrob,” “a man,” and “audience
            favourite” about you, and the camera catches your held look across the divide as the quiz closes.'
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
