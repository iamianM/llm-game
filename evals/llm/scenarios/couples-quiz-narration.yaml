id: couples-quiz-narration
title: Couples Quiz Two-Sided Round
question: Can alternating quiz rounds name real mismatches without inventing scores?
category: challenges
goal: Prove the Event Narrator handles alternating player/partner rounds and names actual mismatches without inventing scoring.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: couples_quiz_arc_faithful
      criteria: >
        The wrap makes both directions clear: the player's answers about Chloe and Chloe's answers
        about the player. It names a real example in each direction,
        includes the comfort-show miss, and preserves the recorded partial classification. Total
        points and match count belong in the adjacent engine result and need not be repeated. Fail
        if it calls the result a full success, swaps who answered a round, or reduces the scene to
        a generic score summary.
seed: 313
initial_day: 3
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 6
    spark: 5
    loyalty: 8
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 45
    trust: 30
    friendship: 25
judge_context:
  - The Couples Quiz alternates direction. Even rounds quiz the player about the partner. Odd rounds ask the player to guess what the partner guessed about THEM.
  - Match scoring and any streak penalty are already visible in the engine result beside the prose.
  - Narration must name at least one specific mismatch or match by question text or answer.
turns:
  - id: morning-to-couples-quiz
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls: []
    checks:
      - ceremony_events_present
  - id: r1-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 0 } }
    golden:
      calls: []
    checks: []
  - id: r2-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 1 } }
    golden:
      calls: []
    checks: []
  - id: r3-wrong
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: distractor_0, round_index: 2 } }
    golden:
      calls: []
    checks: []
  - id: r4-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 3 } }
    golden:
      calls: []
    checks: []
  - id: r5-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 4 } }
    golden:
      calls: []
    checks: []
  - id: r6-correct
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: correct, round_index: 5 } }
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: >
            You know Chloe is twenty-six and from Liverpool, while Chloe correctly predicts your
            Heartthrob choice and audience answer. Your comfort-show answer is the miss: you choose
            Taskmaster clips under a blanket instead of Gavin and Stacey. The result is partial.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
