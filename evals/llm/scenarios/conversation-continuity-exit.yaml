id: conversation-continuity-exit
title: Conversation Continuity And Exit
question: Can Chloe remember earlier turns and end the conversation naturally?
category: conversation
goal: Prove a multi-turn Chloe chat remembers itself. Every line builds on the last, the wheel stays legal, and the close feels like a social ending instead of an exit button.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: conversation_arc_continuity
      criteria: >
        Read each actual output against the reviewed turns replayed before it. The honest_vulnerable
        follow-up must respond to the school, routines, and belonging in the reviewed opening, and the ending
        must refer to what the reviewed conversation established. A reciprocal disclosure about the same subject is
        valid when it stays on the same subject; it need not repeat the final noun in her line.
        Fail a genuinely unrelated confession, a response to the
        reviewed prefix, or a generic close.
    - id: chloe_voice_and_memory
      criteria: >
        Chloe remains warm, sincere, and a little guarded without becoming cold. The curator may store one
        accurate memory grounded in the reviewed conversation, the actual closing exchange earlier in the
        same target turn, or both. Fail generic summaries, facts absent from both sources, or invented details.
causal_thread_check:
  id: scenario_acceptance
  severity: blocking
  criteria:
    - id: actual_conversation_arc
      criteria: >
        Read the three actual turns as one conversation. Each later turn must answer and build on the actual
        exchange before it without changing the subject, repeating the same question, or inventing history.
        The final turn must close the actual conversation naturally.
    - id: actual_voice_and_memory
      criteria: >
        Chloe remains warm, sincere, and a little guarded across the actual sequence. Any stored memory must
        accurately summarize facts or commitments from the actual conversation. Fail generic summaries,
        unsupported facts, therapy language, or a memory that is longer than the useful fact it preserves.
seed: 202
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  chloe:
    affection: 45
    chemistry: 20
    trust: 25
    friendship: 25
judge_context:
  - Chloe is a secure sweetheart who already trusts the player a little, so deep follow-ups are legal.
  - The follow-up selects the stable engine-owned honest_vulnerable intent. Its wording and subject must follow Chloe's reviewed prior line.
  - Each menu must be playable, with concrete, distinct options and exactly one exit.
turns:
  - id: start-chloe-deep
    action:
      kind: start_conversation
      target_id: chloe
      intent_id: deep_ask_life
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: What do you miss most about Liverpool?
          npc_dialogue: The school, mostly. I miss knowing where I fit without having to think about it.
          npc_tone: vulnerable
          npc_mood_after: content
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Ask what makes school feel settled
            category: supportive
            intent_kind: ask_about_topic
            stat_used: eq
            risk: safe
            tone: attentive
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          - label: Ask about the school
            category: friendly
            intent_kind: ask_about_topic
            stat_used: charm
            risk: low
            tone: reassuring
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
  - id: first-follow-up
    action:
      kind: respond_with
      target_id: chloe
      intent_id: honest_vulnerable
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: I get that. I miss the routines that make home feel like mine more than the big things.
          npc_dialogue: Exactly. At school I know where I fit. Here, everyone is still working each other out.
          npc_tone: warm
          npc_mood_after: content
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Ask what she teaches
            category: friendly
            intent_kind: ask_about_topic
            stat_used: charm
            risk: low
            tone: curious
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          - label: Admit you feel unsteady too
            category: deep
            intent_kind: honest_vulnerable
            stat_used: eq
            risk: medium
            tone: open
            audience_hint: +
            reveal_tier: 1
            reveal_tag: belonging
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
  - id: close-conversation
    # Soft exit via the "End on a good note" option, not the bail-out
    # end_conversation action, which is the deliberately rude ghost-out.
    action:
      kind: respond_with
      target_id: chloe
      intent_id: end_softly
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: I'll let you get back to your tea. Tell me about the school another time?
          npc_dialogue: That I can do. Catch me when it is a bit quieter.
          npc_tone: warm
          npc_mood_after: happy
      - agent: conversation_curator
        output_type: MemoryBatch
        output:
          kind: player
          memories:
          - holder_id: player
            subject_id: chloe
            content: Chloe misses the easy sense of belonging she has at school in Liverpool.
            source: direct
            source_id: null
            emotional_weight: 4
            tags: [school, belonging]
            durable: true
          summary: Chloe and the player connected over how familiar routines create a sense of belonging.
          gossip_seeds: []
    checks:
      - conversation_closed
      - curator_batch_recorded
      - agent_traces_present
