id: conversation-continuity-exit
title: Conversation Continuity And Exit
question: Can Chloe remember earlier turns and end the conversation naturally?
category: conversation
goal: Prove a multi-turn Chloe chat remembers itself. Every line builds on the last, the wheel stays legal, and the close feels like a social ending instead of an exit button.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: conversation_arc_continuity
      criteria: >
        Read the actual outputs as one conversation. The honest_vulnerable follow-up must respond
        to a concrete detail, stance, or subject opened by Chloe's actual exchange, and the ending
        must refer to what they actually shared. A reciprocal disclosure about the same subject is
        valid when it respects any boundary Chloe set; it need not repeat the final noun in her line.
        Fail a genuinely unrelated confession, pressure against her boundary, a response to the
        reviewed example instead of the actual line, or a generic close.
    - id: chloe_voice_and_memory
      criteria: >
        Chloe remains warm, sincere, and guarded without becoming cold. The curator may store one
        accurate memory of the specific subject from the actual conversation. If Chloe sets a boundary,
        both useful perspectives preserve it. Fail generic summaries, facts copied from the reviewed
        example but absent from the actual chat, or invented details.
seed: 202
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  chloe:
    affection: 45
    chemistry: 20
    trust: 25
    friendship: 25
judge_context:
  - Chloe is a secure sweetheart who already trusts the player a little, so deep follow-ups are legal.
  - The follow-up selects the stable engine-owned honest_vulnerable intent. Its wording and subject must follow Chloe's actual prior line.
  - Each menu must be playable, with concrete, distinct options and exactly one exit.
turns:
  - id: start-chloe-deep
    action:
      kind: start_conversation
      target_id: chloe
      intent_id: deep_ask_life
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: What do you miss most about Liverpool?
          npc_dialogue: The school, mostly. Family is a longer answer, and I'm not doing that one by the pool.
          npc_tone: defensive
          npc_mood_after: content
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Leave it there
            category: supportive
            intent_kind: supportive_reassure
            stat_used: eq
            risk: safe
            tone: gentle
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          - label: Ask about the school
            category: friendly
            intent_kind: ask_about_topic
            stat_used: charm
            risk: low
            tone: reassuring
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
  - id: first-follow-up
    action:
      kind: respond_with
      target_id: chloe
      intent_id: honest_vulnerable
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        criteria:
          - The player shares something honest that responds to Chloe's actual opening answer instead of asking a disconnected question.
          - Chloe answers that disclosure and does not reply to a detail that appears only in the reviewed opening example.
          - The exchange preserves any boundary Chloe set in the actual opening answer.
      - agent: contextual_options
        output_type: ContextualBespoke
        criteria:
          - Each bespoke choice responds to a concrete detail or stance in Chloe's actual latest line.
          - The choices offer meaningfully different continuations and do not reopen a boundary she set.
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
  - id: close-conversation
    # Soft exit via the "End on a good note" option, not the bail-out
    # end_conversation action, which is the deliberately rude ghost-out.
    action:
      kind: respond_with
      target_id: chloe
      intent_id: end_softly
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        criteria:
          - The selected end_softly intent produces a clear, warm ending tied to the actual subject they discussed.
          - Neither line invents a prior disclosure or responds to the reviewed example instead of the actual conversation.
      - agent: conversation_curator
        output_type: MemoryBatch
        criteria:
          - The recap contains only subjects and actions present in the actual three-turn conversation.
          - Store no memory for routine small talk. If the actual chat contains a useful fact, store only that fact with the correct holder and subject.
          - If Chloe set a meaningful boundary and the player respected it, preserve both useful perspectives.
    checks:
      - conversation_closed
      - curator_batch_recorded
      - agent_traces_present
