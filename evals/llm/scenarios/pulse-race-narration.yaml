id: pulse-race-narration
title: Pulse Race Reveal
goal: Prove the Event Narrator dramatises a Pulse Race result using the recorded chemistry matrix and the player's read-the-room guesses.
seed: 707
initial_day: 2
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 7
    banter: 6
    eq: 5
    spark: 5
    loyalty: 7
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 35
    trust: 20
    friendship: 15
    chemistry: 50
  maya:
    affection: 25
    trust: 10
    friendship: 10
    chemistry: 72  # highest non-partner chemistry — round 1 correct answer is Maya
judge_context:
  - Pulse Race is now a three-round read-the-room minigame; each round
    asks the player to guess whose pulse climbed for whom.
  - The chemistry matrix is engine-computed; the narrator may NOT invent
    chemistry values beyond what's surfaced in the reveal payloads.
  - Use bracketed Names (the (Name) form in the participants line),
    never the raw underscore ids.
turns:
  - id: morning-to-pulse-race
    action:
      kind: ambient
      target_id: ambient_wait
    golden: >
      Morning burns out. Producer announces Pulse Race. The matrix is
      computed and three guess rounds are queued. pending_challenge.kind
      == "heart_rate"; round 1's correct answer is Maya (highest
      non-partner chemistry at 72).
    checks:
      - ceremony_events_present
  - id: round1-pick-maya
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 0
    golden: >
      Player guesses right — Maya did spike for them. Engine advances
      to round 2.
    checks: []
  - id: round2-pick-first-option
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 1
    golden: >
      Player guesses correctly on the partner round too. Advance to
      round 3.
    checks: []
  - id: round3-final-pick
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 2
    golden: >
      Final guess locks. Three correct = success classification. The
      narrator writes the wrap: names the strongest matrix pair
      (player+Maya at 88 BPM), references at least one of the player's
      guesses by name, and treats the room's reveal as the dramatic
      core.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
    judge_checks:
      - id: chemistry_named
        criteria: >
          The prose names a specific chemistry pair from the recorded
          reveals — at minimum the strongest matrix entry — and references
          the BPM or chemistry value spelled out. Generic "the room got
          hot" without naming the pair fails.
      - id: guesses_named
        criteria: >
          The prose references at least one of the player's actual
          guesses (a Name from a chosen choice). A wrap that doesn't tie
          back to what the player did fails.
      - id: no_invented_pairs
        criteria: >
          No invented chemistry pairs beyond the matrix entries actually
          recorded on the round's reveals.
      - id: no_raw_ids
        criteria: >
          The prose uses Names ("Maya", "Chloe", "Blake") and never raw
          underscore ids ("blake", "nia"). Fails on any
          underscore-suffixed id in the output.
