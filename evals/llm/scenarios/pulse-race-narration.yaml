id: pulse-race-narration
title: Pulse Race Reveal
question: Can the reveal use the recorded chemistry matrix and actual guesses?
category: challenges
goal: Prove the Event Narrator dramatises a Pulse Race result using the recorded chemistry matrix and the player's read-the-room guesses.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: pulse_race_story_faithful
      criteria: >
        The wrap ties the player's actual guesses to named chemistry pairs and recorded BPM or
        chemistry values, foregrounds at least the strongest reveal, and never invents a pair
        outside the matrix or exposes raw internal ids.
seed: 707
initial_day: 2
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 7
    banter: 6
    eq: 5
    spark: 5
    loyalty: 7
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 35
    trust: 20
    friendship: 15
    chemistry: 50
  maya:
    affection: 25
    trust: 10
    friendship: 10
    chemistry: 72  # highest non-partner chemistry — round 1 correct answer is Maya
judge_context:
  - Pulse Race is now a three-round read-the-room minigame; each round
    asks the player to guess whose pulse climbed for whom.
  - The chemistry matrix is engine-computed; the narrator may NOT invent
    chemistry values beyond what's surfaced in the reveal payloads.
  - Use ordinary display names in prose and never expose raw underscore ids.
turns:
  - id: morning-to-pulse-race
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: Morning burns out. Producer announces Pulse Race. The matrix is computed and three guess rounds
        are queued. pending_challenge.kind == "heart_rate"; round 1's correct answer is Maya (highest non-partner
        chemistry at 72).
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the pool, no resolved ceremony beat lands yet. You and Chloe stay together in the frame,
            her eyes meeting yours as the moment holds.
    checks:
      - ceremony_events_present
  - id: round1-pick-maya
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 0
    golden:
      criteria: Player guesses right — Maya did spike for them. Engine advances to round 2.
      calls: []
    checks: []
  - id: round2-pick-first-option
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 1
    golden:
      criteria: Player guesses correctly on the partner round too. Advance to round 3.
      calls: []
    checks: []
  - id: round3-final-pick
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 2
    golden:
      criteria: 'Final guess locks. Three correct = success classification. The narrator writes the wrap:
        names the strongest matrix pair (player+Maya at 88 BPM), references at least one of the player''s
        guesses by name, and treats the room''s reveal as the dramatic core.'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: 'The Pulse Race ends in success as you read the room cleanly, choosing Maya when her pulse
            climbs highest watching you, then naming Blake for Chloe’s standout moment. But the camera catches
            the sharper spark: Maya’s bit sends your pulse to eighty-eight while she watches, while Chloe
            and you mirror each other at eighty-two—and Chloe’s eyes stay fixed on you through the reveal.'
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
