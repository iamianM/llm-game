id: pulse-race-narration
title: Pulse Race Reveal
question: Can the reveal use the recorded chemistry matrix and actual guesses?
category: challenges
goal: Prove the Event Narrator dramatises a Pulse Race result using the recorded chemistry matrix and the player's read-the-room guesses.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: pulse_race_story_faithful
      criteria: >
        The wrap names at least one actual player guess, foregrounds the strongest recorded pair,
        and compares that result with Chloe's recorded result so the result outside the player's
        couple is clear. The adjacent engine panel holds all three selections, so the prose need not
        repeat every guess or invent a cast reaction. Fail a list of readings with no relationship
        implication, an invented pair, or exposed raw ids.
seed: 707
initial_day: 2
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 7
    banter: 6
    eq: 5
    spark: 5
    loyalty: 7
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 35
    trust: 20
    friendship: 15
    chemistry: 50
  maya:
    affection: 25
    trust: 10
    friendship: 10
    chemistry: 72  # highest non-partner chemistry — round 1 correct answer is Maya
judge_context:
  - Pulse Race is now a three-round read-the-room minigame; each round
    asks the player to guess whose pulse climbed for whom.
  - The chemistry matrix is engine-computed; the narrator may NOT invent
    chemistry values beyond what's surfaced in the reveal payloads.
  - Use ordinary display names in prose and never expose raw underscore ids.
turns:
  - id: morning-to-pulse-race
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls: []
    checks:
      - ceremony_events_present
  - id: round1-pick-maya
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 0
    golden:
      calls: []
    checks: []
  - id: round2-pick-first-option
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 1
    golden:
      calls: []
    checks: []
  - id: round3-final-pick
    action:
      kind: challenge_response
      target_id: maya
      payload:
        choice_id: correct
        round_index: 2
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: You correctly pick Maya while you perform, Blake while Chloe performs, and Maya while you
            watch. Maya watching you and you watching Maya both reach 88 BPM. You and Chloe reach 82 in
            both directions, so the strongest reaction sits outside your couple.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
