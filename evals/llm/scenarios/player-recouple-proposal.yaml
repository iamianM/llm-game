id: player-recouple-proposal
title: Player Heart Swap Proposal
goal: Prove a player-initiated Heart Swap proposal closes the conversation cleanly, records memories, and narrates only the deterministic answer — without the LLM choosing acceptance or invented couples.
seed: 808
initial_location: kitchen
live_villa_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 9
    banter: 6
    eq: 5
    graft: 5
    loyalty: 5
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
  - partner_a_id: maya
    partner_b_id: marcus_start
    formed_on_day: 1
initial_relationships:
  maya:
    affection: 72
    chemistry: 74
    trust: 35
    friendship: 20
  chloe:
    affection: 40
    trust: 30
judge_context:
  - Maya is eligible for a player Heart Swap proposal because affection and chemistry are high.
  - The engine decides whether the proposal is accepted and applies all couple changes.
  - npc_proposal_incoming events are pending asks from the NPC; they are not acceptance of the player's proposal and not a couple change.
turns:
  - id: start-maya-before-proposal
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_intimate_eye_contact
    golden: >
      A charged kitchen moment. Maya is bright and a little caught off
      guard; the romantic charge is real but the door is still open in both
      directions. Imagine: "...don't look at me like that with witnesses
      around, mate. ...okay, do it again." Menu offers escalate, pull
      back, exit.
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - exactly_one_exit
      - conversation_active
      - agent_traces_present
    judge_checks:
      - id: maya_charge_specific
        criteria: >
          Maya treats the moment as real flirtation, not friendship or
          gossip. Fail if her line ignores the eye contact, becomes
          sisterly, or pre-decides any proposal outcome.
      - id: followups_playable
        criteria: >
          Follow-up menu offers concrete escalate / pull back / exit
          choices for this exact beat.
  - id: propose-to-maya
    action:
      kind: propose_recouple
      target_id: maya
    golden: >
      The proposal narration describes the engine's answer — accepted,
      declined, or counter-pending — and only that. If an
      npc_proposal_incoming event was recorded, the narration may mention
      it as a pending ask back, never as acceptance. Memories should
      capture the specific words the player used and how Maya reacted.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - conversation_closed
      - curator_memories
      - agent_traces_present
    judge_checks:
      - id: proposal_result_faithful
        criteria: >
          The narration and memories match the recorded proposal outcome
          exactly. The narrator does not flip the answer, invent a
          completed couple change, or treat an npc_proposal_incoming as
          anything other than a pending ask.
      - id: memory_specific
        criteria: >
          Memories name the proposal action and Maya's reaction in
          specifics, not as a generic "I asked Maya". Fail if either side's
          memory is a vague placeholder.
