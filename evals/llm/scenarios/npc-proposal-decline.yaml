id: npc-proposal-decline
title: NPC Proposal Harsh Decline
question: Can the player reject a proposal without silently changing couples?
category: pairing_and_endings
goal: Prove an NPC-initiated Heart Swap proposal can be declined without changing couples, while preserving the exact relationship and audience consequences.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: proposal_decline_arc_faithful
      criteria: >
        Maya's first beat remains a pending ask and the response beat clearly declines it without
        forming a new couple. The narration must preserve the engine-owned consequences and not
        pre-resolve, accept, or leave the proposal pending.
seed: 4
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: man
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
  - partner_a_id: maya
    partner_b_id: liam
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 45
    chemistry: 20
    trust: 35
    friendship: 20
  maya:
    affection: 80
    chemistry: 90
    trust: 5
    friendship: 20
judge_context:
  - Maya is eligible to propose because her affection and chemistry with the player are high and her current couple is weak.
  - A harsh decline is a resolved answer, not a pending ask and not a couple change.
  - The engine applies the harsh-decline deltas to Maya and a small audience penalty to the player.
turns:
  - id: maya-asks
    action:
      kind: ambient
      target_id: pool_people_watch
    golden:
      criteria: Maya's proposal becomes a pending ask. The narration can frame the charged moment, but it
        must not claim the player accepted, rejected, or formed a new couple yet.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: By the pool, Maya makes it clear she wants to ask you to pair, and the possibility lands
            like a spark across Sunset Bay. Chloe stays beside you, her eyes fixed on you as the moment presses
            against the couple you already share.
    checks:
      - pending_npc_proposal_from:maya
      - ceremony_event_present:npc_proposal_incoming
      - event_narration_valid
      - agent_traces_present
  - id: decline-maya-harshly
    action:
      kind: npc_proposal_response
      target_id: maya
      intent_id: decline_harshly
    golden:
      criteria: The response is a harsh decline. The narration can make the rejection sting, but it must keep
        the existing couples intact, clear the pending ask, and preserve the exact engine consequences for
        Maya and the audience.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the pool, Maya’s proposal reaches you—and is rejected, leaving the moment hanging in a
            clean, unmistakable sting. Chloe stays beside you as the camera catches the silence between you,
            her eyes fixed on yours while Maya absorbs the refusal.
    checks:
      - proposal_outcome_is:rejected
      - pending_npc_proposal_cleared
      - ceremony_event_present:npc_proposal_response
      - couple_present:player:chloe
      - couple_present:maya:liam
      - relationship_delta:maya:affection:-5
      - relationship_delta:maya:chemistry:-5
      - relationship_delta:maya:trust:-2
      - audience_delta:-1
      - event_narration_valid
      - agent_traces_present
