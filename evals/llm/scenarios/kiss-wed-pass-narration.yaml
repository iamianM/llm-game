id: kiss-wed-pass-narration
title: Kiss Wed Pass Allocation
question: Can the narrator dramatise all three choices accurately?
category: challenges
goal: Prove the narrator names each of the three allocations specifically and dramatises the pass pick.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: allocation_story_faithful
      criteria: >
        The wrap names the recorded kiss, wed, and pass choices, makes the rival pass a dramatic
        but not cruel power move, and does not replace any pick or invent a different outcome.
seed: 511
initial_day: 5
initial_phase: morning
live_resort_life: false
character_creation:
  archetype_id: class_clown
  gender: man
  stats:
    charm: 5
    banter: 8
    eq: 5
    spark: 5
    loyalty: 7
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 50
    trust: 35
    friendship: 25
  maya:
    affection: 30
    trust: 10
    friendship: 15
    chemistry: 70  # makes Maya the top-chemistry non-partner pick
  blake:
    affection: 5   # lowest non-partner affection -> rival role
    trust: 0
    friendship: 0
judge_context:
  - Kiss Wed Pass has three sequential rounds (kiss, wed, pass). The pool shrinks after each pick.
  - The narrator must name the three picks by label and target. Passing the rival is a power move; passing the partner is a self-destruct.
turns:
  - id: morning-to-kwp
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: 'Morning ends. Producer announces Kiss Wed Pass. Three rounds queued with three candidate
        targets: partner Chloe, top-chemistry Maya, rival Blake.'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the pool, you and Chloe remain coupled, sharing a held silence as the moment stays unresolved.
            No new outcome lands.
    checks:
      - ceremony_events_present
  - id: kiss-maya
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: target_maya, round_index: 0 } }
    golden:
      criteria: Player kisss Maya (chemistry pick). Pool shrinks for round 2.
      calls: []
    checks: []
  - id: wed-chloe
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: target_chloe, round_index: 1 } }
    golden:
      criteria: Player weds Chloe (partner pick). Only Blake remains.
      calls: []
    checks: []
  - id: pass-blake
    action: { kind: challenge_response, target_id: chloe, payload: { choice_id: target_blake, round_index: 2 } }
    golden:
      criteria: Player passes Blake (rival). Classification success (kiss_chemistry 3 + wed_partner 3 + pass_rival
        3 = 9 pts >= success threshold 6). Audience +5. Narrator names all three picks specifically.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The Kiss Wed Pass lands cleanly at the pool, with every card played and the afternoon crowd
            locked onto you. You choose Maya for the kiss, then give the Wed card to Chloe, and her reaction
            breaks through as your eyes meet across the flame-deck benches. Blake receives the final Pass,
            while Chloe remains the partner at the center of the moment.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
