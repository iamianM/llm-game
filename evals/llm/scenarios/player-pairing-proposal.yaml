id: player-pair-proposal
title: Player Heart Swap Proposal
question: Can a player proposal narrate the engine's answer without choosing it?
category: pairing_and_endings
goal: Prove a player-initiated Heart Swap proposal closes the conversation cleanly, records memories, and narrates only the deterministic answer — without the LLM choosing acceptance or invented couples.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: player_proposal_arc_faithful
      criteria: >
        The kitchen flirt gives both people room to choose what happens next. The proposal beat
        then preserves Maya's rejection and treats her separate incoming proposal as unanswered,
        not as a counter-acceptance or a couple change. Each memory keeps its holder's point of
        view and recalls something that person could see or hear.
seed: 808
initial_location: kitchen
live_resort_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 9
    banter: 6
    eq: 5
    spark: 5
    loyalty: 5
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
  - partner_a_id: maya
    partner_b_id: marcus
    formed_on_day: 1
initial_relationships:
  maya:
    affection: 72
    chemistry: 74
    trust: 35
    friendship: 20
  chloe:
    affection: 40
    trust: 30
judge_context:
  - Maya is eligible for a player Heart Swap proposal because affection and chemistry are high.
  - The engine decides whether the proposal is accepted and applies all couple changes.
  - npc_proposal_incoming events are pending asks from the NPC; they are not acceptance of the player's proposal and not a couple change.
turns:
  - id: start-maya-before-proposal
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_intimate_eye_contact
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: Were you looking at me, or am I imagining it?
          npc_dialogue: I was. What are you going to do about it?
          npc_tone: flirty
          npc_mood_after: flirty
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Ask what she wants
            category: deep
            intent_kind: ask_about_topic
            stat_used: eq
            risk: medium
            tone: sincere
            audience_hint: +
            reveal_tier: 3
            reveal_tag: mutual_intent
            unlock_threshold: null
          - label: Tell her you noticed
            category: supportive
            intent_kind: supportive_validate
            stat_used: loyalty
            risk: low
            tone: warm
            audience_hint: +
            reveal_tier: 0
            reveal_tag: seen_without_performance
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
  - id: propose-to-maya
    action:
      kind: propose_pair
      target_id: maya
    golden:
      calls:
      - agent: conversation_curator
        output_type: MemoryBatch
        criteria:
          - Summarize only the actual kitchen exchange that occurred before the proposal.
          - Keep any memories in each holder's point of view and limited to what that person heard or saw.
          - A routine flirt may produce no durable memory; do not invent a stronger admission than the exchange contains.
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: Maya turns down the player's proposal in the kitchen. She then makes her own offer,
            leaving the player to answer it; no couple has changed yet.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - conversation_closed
      - curator_memories
      - agent_traces_present
