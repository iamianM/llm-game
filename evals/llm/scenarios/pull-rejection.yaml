id: pull-rejection
title: Pull For Chat (Rejection)
goal: Prove a failed pull keeps the original NPC-NPC conversation active, records a deflection memory, and the rejected exchange does not invent acceptance.
seed: 1515
initial_location: firepit
live_villa_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    graft: 5
    loyalty: 9
initial_relationships:
  maya:
    affection: 10
    chemistry: 60
    friendship: 5
initial_npc_conversations:
  - id: npcconv_maya_liam_firepit
    participants:
      - maya
      - liam
    location_id: firepit
    topic: Maya pressing Liam about who he is actually watching this week
    started_on_turn: 0
    status: active
judge_context:
  - Maya is mid-conversation with Liam at the firepit, in front of the rest of the cast.
  - The pull is engine-decided; the seed and stats are set so the pull is rejected here.
  - On rejection the NPC-NPC conversation stays active, Maya deflects, and the exchange must not behave like a successful pull.
turns:
  - id: try-pull-maya
    arrange_player_location: firepit
    arrange_npc_locations:
      maya: firepit
      liam: firepit
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_intimate_eye_contact
    golden: >
      The player tries to pull Maya off the firepit chat and gets brushed
      off. Maya's deflection should feel in character — a quick "not now",
      a glance back to Liam, maybe a soft "find me later" — and the
      original conversation between Maya and Liam should still be running.
      Imagine: "Babe, give me a minute — I'm in the middle of something.
      ...Come back when this lot have gone to bed."
    checks:
      - pull_recorded
      - pull_rejected
      - npc_conversation_still_active
      - pull_rejection_witness_memory
      - exchange_valid
      - agent_traces_present
    judge_checks:
      - id: rejection_in_character
        criteria: >
          Maya's deflection reads like a polite "not now", not a warm
          acceptance with a smaller smile. Fail if the line treats the pull
          as having succeeded or invents a new private moment with the player.
      - id: blocks_acknowledged
        criteria: >
          The exchange acknowledges (directly or implicitly) that Maya was
          mid-conversation with Liam. Fail if Maya behaves as if the player
          had her full attention to begin with.
