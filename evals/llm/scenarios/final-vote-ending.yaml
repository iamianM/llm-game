id: final-vote-ending
title: Final Vote Finale
goal: Prove the finale narration names the deterministic winning couple and the player's actual outcome — no rewrites, no consolation prizes, no invented twists.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: final_vote_story_faithful
      criteria: >
        The finale carries emotional and visual weight while preserving the recorded winner,
        runner-up order, and player outcome exactly. Fail if it invents a tie, consolation prize,
        alternate placement, or different winning couple.
seed: 909
initial_day: 6
initial_phase: evening
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 5
  - partner_a_id: maya
    partner_b_id: liam
    formed_on_day: 5
  - partner_a_id: sophie
    partner_b_id: marcus
    formed_on_day: 5
  - partner_a_id: nia
    partner_b_id: blake
    formed_on_day: 5
initial_relationships:
  chloe:
    affection: 80
    chemistry: 30
    trust: 70
    friendship: 25
judge_context:
  - The final vote outcome is deterministic; the narrator describes the engine's verdict.
  - The narrator may carry finale weight — the flame_deck at night, the speeches, the camera holding on each couple — but cannot move the prize.
turns:
  - id: schedule-final-vote
    action:
      kind: ambient
      target_id: ambient_wait
    golden: >
      The resort is called to the flame_deck one last time. The producer text
      lands, the four couples assemble, and the narrator sets the finale
      stakes — months of moments hanging on the next reveal. The outcome
      is still pending.
    checks:
      - ceremony_events_present
      - pending_gather_waiting
      - agent_traces_present
  - id: resolve-final-vote
    action:
      kind: join_gather
    golden: >
      The final vote lands. The narrator names the winning couple exactly
      as the engine recorded, places the player and Chloe in their actual
      finishing position, and gives the moment finale weight — a kiss, a
      held look, the cast and the cameras all at once. Imagine: "The host
      reads the result. Maya and Liam win it. Chloe finds the player's
      hand in the dark. Sunset Bay's first season ends with both couples
      still on the flame_deck and the cameras drifting away."
    checks:
      - ceremony_events_present
      - event_narration_valid
      - run_outcome_present
      - agent_traces_present
