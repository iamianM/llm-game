judge_context:
  - The final vote outcome is deterministic; the narrator describes the engine's verdict.
  - The narrator may carry finale weight — the flame_deck at night, the speeches, the camera holding on each couple — but cannot move the prize.
turns:
  - id: schedule-final-vote
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: The resort is called to the flame_deck one last time. The producer text lands, the four couples
        assemble, and the narrator sets the finale stakes — months of moments hanging on the next reveal.
        The outcome is still pending.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The call goes out across Sunset Bay, sending everyone toward the Flame Deck for the Final
            Vote. Beside you, Chloe catches your eye for one held breath, and the two of you move together
            into the approaching reckoning.
    checks:
      - ceremony_events_present
      - pending_gather_waiting
      - agent_traces_present
  - id: resolve-final-vote
    action:
      kind: join_gather
    golden:
      criteria: 'The final vote lands. The narrator names the winning couple exactly as the engine recorded,
        places the player and Chloe in their actual finishing position, and gives the moment finale weight
        — a kiss, a held look, the cast and the cameras all at once. Imagine: "The host reads the result.
        Maya and Liam win it. Chloe finds the player''s hand in the dark. Sunset Bay''s first season ends
        with both couples still on the flame_deck and the cameras drifting away."'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The Pulse vote lands, and you and Chloe win as the top couple at Sunset Bay. Chloe’s eyes
            meet yours, her smile breaking through as the result settles in, and the flame deck erupts around
            you.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - run_outcome_present
      - agent_traces_present
