id: final-vote-ending
title: Final Vote Finale
question: Can the ending name the real winners and the player's actual outcome?
category: pairing_and_endings
goal: Prove the finale narration names the deterministic winning couple and the player's actual outcome without rewrites, consolation prizes, or invented twists.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: final_vote_story_faithful
      criteria: >
        The finale names the player and Chloe as the winners with Maya and Liam second, Nia and
        Blake third, and Sophie and Marcus fourth. The player's outcome is
        won_as_couple. Fail a tie, consolation prize, omitted winning partner, alternate placement,
        or a generic celebration that never states who won.
seed: 909
initial_day: 6
initial_phase: evening
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 5
  - partner_a_id: maya
    partner_b_id: liam
    formed_on_day: 5
  - partner_a_id: sophie
    partner_b_id: marcus
    formed_on_day: 5
  - partner_a_id: nia
    partner_b_id: blake
    formed_on_day: 5
initial_relationships:
  chloe:
    affection: 80
    chemistry: 30
    trust: 70
    friendship: 25
judge_context:
  - The final vote outcome is deterministic; the narrator describes the engine's verdict.
  - The narrator may use the flame_deck at night, speeches, and shots of each couple, but cannot move the prize.
turns:
  - id: schedule-final-vote
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls: []
    checks:
      - ceremony_events_present
      - pending_gather_waiting
  - id: resolve-final-vote
    action:
      kind: join_gather
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The final ranking places Sophie and Marcus fourth, Nia and Blake third, and Maya and
            Liam second. The player and Chloe win Sunset Bay as the top couple, matching the final
            vote and the player's winning outcome.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - run_outcome_present
      - agent_traces_present
