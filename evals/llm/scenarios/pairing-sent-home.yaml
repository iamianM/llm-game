id: pairing-heart_out
title: Pairing Ceremony With A Heart Out
question: Can a pairing and elimination land as one accurate dramatic beat?
category: pairing_and_endings
goal: Prove a deterministic Pairing Ceremony (pairing) and a Heart Out (heart_out) narrate as one dramatic beat — the right names, the right couples, the right elimination — without the LLM picking any of it.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: pairing_ceremony_story_faithful
      criteria: >
        The narration must treat pairing and Heart Out as one ceremony, preserve all four recorded
        couples, and send only Nia home. It should include one restrained scene-level pause or quiet
        beat without assigning unsupported motives, history, gestures, or private feelings. It must never
        save Nia, swap a partner, invent another elimination, or read like a bare event log.
seed: 707
initial_day: 3
initial_phase: evening
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
  - partner_a_id: maya
    partner_b_id: liam
    formed_on_day: 1
  - partner_a_id: sophie
    partner_b_id: marcus
    formed_on_day: 1
  - partner_a_id: nia
    partner_b_id: blake
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 55
    chemistry: 25
    trust: 35
  maya:
    affection: 35
    chemistry: 20
  sophie:
    affection: 30
    chemistry: 25
  nia:
    affection: 25
    friendship: 20
judge_context:
  - The Pairing Ceremony and any Heart Out are decided by deterministic code before the narrator runs.
  - The narrator must mirror the ceremony events exactly — same couples, same eliminated Heartbreaker, nothing rescued, nothing reassigned.
  - A brief pause or the Flame Deck going quiet can carry the ceremony tension without inventing a contestant's reaction, speech, or motive.
turns:
  - id: schedule-pairing
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls: []
    checks:
      - ceremony_events_present
      - pending_gather_waiting
  - id: resolve-pairing
    action:
      kind: join_gather
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: >
            The Pairing Ceremony locks in four couples: you and Marcus, Liam and Chloe, Blake and Maya,
            then Jordan and Sophie. The flame deck falls quiet before the final result. Nia is the only
            Heartbreaker left single, and she goes Heart Out.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - agent_traces_present
