id: challenge-result-narration
title: Challenge Result Narration
question: Can a scored challenge feel dramatic without changing the result?
category: challenges
goal: Prove the Event Narrator makes a deterministic Compatibility Quiz result feel like a moment, without changing who scored what.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: challenge_story_faithful
      criteria: >
        The complete Compatibility Quiz sequence culminates in narration faithful to the
        recorded classification and relationship/audience direction, names a real question or
        answer from the rounds, and includes a specific cast reaction without inventing rules.
seed: 505
initial_phase: intros
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 45
    trust: 30
    friendship: 20
judge_context:
  - Compatibility Quiz scoring is deterministic engine output (see docs/systems/minigames.md §5). The narrator describes the resolved outcome.
  - The narrator may dramatise rounds, reveals, and cast reactions, but cannot change classification, total_points, audience_delta, or relationship deltas.
  - Wrong-answer reveals expose the truth at reduced confidence (`KnownFact.source = "quiz_misread"`, `confidence = 0.5`); the narrator may reference this without inventing a different fact.
turns:
  - id: morning-to-challenge
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: Morning ends and the producer announces the Compatibility Quiz. pending_challenge.kind is
        compatibility_quiz and five rounds have been built. No outcome yet — the rounds are waiting for the
        player.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the pool, the Compatibility Quiz remains pending, leaving the question hanging over you
            and Chloe. She stays close, watching you across the bright water as the unresolved moment settles
            between you.
    checks:
      - ceremony_events_present
  - id: round-1-correct
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: correct
        round_index: 0
    golden:
      criteria: First round, player picks correctly.
      calls: []
    checks: []
  - id: round-2-correct
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: correct
        round_index: 1
    golden:
      criteria: Second round, correct.
      calls: []
    checks: []
  - id: round-3-correct
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: correct
        round_index: 2
    golden:
      criteria: Third round, correct.
      calls: []
    checks: []
  - id: round-4-wrong
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: distractor_0
        round_index: 3
    golden:
      criteria: Fourth round, player guesses wrong.
      calls: []
    checks: []
  - id: round-5-wrong
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: distractor_0
        round_index: 4
    golden:
      criteria: Final round resolves; the Compatibility Quiz wraps. With 3 correct and 2 wrong on a fresh
        Day-1 partner the classification is `failure` or `partial` (engine math); the narrator lands it with
        a resort-texture beat — laughter, wince, Chloe catching the player's eye, the rest of the cast reacting
        — and names at least one specific question/answer pair. No claim of a different score, prize, or relationship
        outcome.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The Compatibility Quiz ends in failure at the pool, and the sting lands hardest on Chloe.
            You sweep through her age, Liverpool hometown, and work as a primary school teacher, but your
            answer of “Taskmaster clips watched under a blanket” misses her comfort show, Gavin and Stacey;
            her smile flickers as she looks across at you. The final miss on “Hot N Cold with full choreography”
            instead of Stay by Rihanna leaves Chloe smiling, but the warmth between you cools.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
