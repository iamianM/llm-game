id: challenge-result-narration
title: Challenge Result Narration
question: Can a scored challenge feel dramatic without changing the result?
category: challenges
goal: Prove the Event Narrator makes a deterministic Compatibility Quiz result feel like a moment, without changing who scored what.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: challenge_story_faithful
      criteria: >
        The wrap must report a failure after the early factual answers mostly land and the final two
        answers miss. It names at least one wrong answer and its revealed truth; it need not list all
        three correct answers. Audience and relationship changes remain in the adjacent engine panel.
        Fail generic score recaps, invented reactions or questions, or any claim that the couple passed.
seed: 505
initial_phase: intros
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 45
    trust: 30
    friendship: 20
judge_context:
  - Compatibility Quiz scoring is deterministic engine output (see docs/systems/minigames.md §5). The narrator describes the resolved outcome.
  - The narrator may dramatise recorded rounds and reveals, but cannot invent a cast reaction or change classification. The adjacent engine panel owns total points, audience change, and relationship changes.
  - Wrong-answer reveals expose the truth at reduced confidence (`KnownFact.source = "quiz_misread"`, `confidence = 0.5`); the narrator may reference this without inventing a different fact.
turns:
  - id: morning-to-challenge
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls: []
    checks:
      - ceremony_events_present
  - id: round-1-correct
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: correct
        round_index: 0
    golden:
      calls: []
    checks: []
  - id: round-2-correct
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: correct
        round_index: 1
    golden:
      calls: []
    checks: []
  - id: round-3-correct
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: correct
        round_index: 2
    golden:
      calls: []
    checks: []
  - id: round-4-wrong
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: distractor_0
        round_index: 3
    golden:
      calls: []
    checks: []
  - id: round-5-wrong
    action:
      kind: challenge_response
      target_id: chloe
      payload:
        choice_id: distractor_0
        round_index: 4
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: >
            You get Chloe's age, Liverpool hometown, and teaching job right. The personal questions
            expose the gap: you choose Taskmaster instead of Gavin and Stacey, then Hot N Cold instead of
            Stay by Rihanna. The two late misses turn the quiz into a failure.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - challenge_resolved
      - agent_traces_present
