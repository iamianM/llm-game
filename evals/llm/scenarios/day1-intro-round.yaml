id: day1-intro-round
title: Day One Intro Round
question: Can eight first greetings establish eight distinct voices?
category: conversation
goal: Prove first impressions land eight distinct voices in eight actions. Each Heartbreaker should sound recognisably themselves on the first hello.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: intro_cast_voice_separation
      criteria: >
        Across the greeting circle, the Heartbreakers answer the player's exact approach through
        their supplied social instincts. Natural overlap between two quiet or warm characters is
        acceptable. The reviewed lines are voice references, not required jokes or beats. One or
        two concise warm replies are valid when the other introductions remain distinct. A brief
        public preference such as reliability is not a confession. A shared ordinary opening word
        such as "Thanks" is not a reused template when the substance differs. Fail when three or
        more replies reuse the same full sentence shape and generic stance, three or more voices contradict their
        direction, a private fear is disclosed, or dialogue assumes a prior private conversation.
    - id: opening_choice_faithful
      criteria: >
        The final ceremony names every participant, follows naturally from the introductions, and
        preserves the player and Chloe as the opening couple. Fail missing or mismatched cast,
        an invented vote or elimination, or any later-game twist.
seed: 404
initial_location: flame_deck
character_creation:
  archetype_id: class_clown
  gender: man
  stats:
    charm: 5
    banter: 9
    eq: 6
    spark: 5
    loyalty: 5
live_resort_life: false
judge_context:
  - Day-1 opens with the greeting circle at the flame_deck before First Spark; intros run first, then the player picks an opening partner.
  - These are quick intros, not deep conversations. Keep each voice true and leave the door open.
  - A deep intro is not permission to disclose a private relationship need. A concise preference or guarded answer can still be receptive.
  - The Heartbreaker Voice agent should make each intro sound like a different person, not the same template with a new name.
turns:
  - id: intro-chloe
    arrange_npc_locations: { chloe: flame_deck }
    action:
      kind: introduce_to
      target_id: chloe
      intent_id: intro_friendly
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: Hi, Chloe. You all right?
          npc_dialogue: Ask me again when I remember half these names. I'm Chloe.
          npc_tone: warm
          npc_mood_after: happy
    checks: &intro_checks
      - exchange_valid
      - agent_traces_present
  - id: intro-maya
    arrange_npc_locations: { maya: flame_deck }
    action:
      kind: introduce_to
      target_id: maya
      intent_id: intro_banter
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: You look like trouble.
          npc_dialogue: Bit early to decide that. Give me ten minutes.
          npc_tone: playful
          npc_mood_after: flirty
    checks: *intro_checks
  - id: intro-liam
    arrange_npc_locations: { liam: flame_deck }
    action:
      kind: introduce_to
      target_id: liam
      intent_id: intro_deep
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: What do you notice first about people?
          npc_dialogue: Whether they do what they say. Saves a lot of guessing.
          npc_tone: warm
          npc_mood_after: content
    checks: *intro_checks
  - id: intro-sophie
    arrange_npc_locations: { sophie: flame_deck }
    action:
      kind: introduce_to
      target_id: sophie
      intent_id: intro_flirty
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: You're hard to read.
          npc_dialogue: Good. You've known me thirty seconds.
          npc_tone: flirty
          npc_mood_after: flirty
    checks: *intro_checks
  - id: intro-nia
    arrange_npc_locations: { nia: flame_deck }
    action:
      kind: introduce_to
      target_id: nia
      intent_id: intro_friendly
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: How's your first night going?
          npc_dialogue: Fast. I think I've introduced myself to Jordan twice.
          npc_tone: warm
          npc_mood_after: happy
    checks: *intro_checks
  - id: intro-marcus
    arrange_npc_locations: { marcus: flame_deck }
    action:
      kind: introduce_to
      target_id: marcus
      intent_id: intro_banter
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: You sizing everyone up already?
          npc_dialogue: A little. You learn plenty before breakfast.
          npc_tone: playful
          npc_mood_after: happy
    checks: *intro_checks
  - id: intro-blake
    arrange_npc_locations: { blake: flame_deck }
    action:
      kind: introduce_to
      target_id: blake
      intent_id: intro_deep
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: What do you make of everyone so far?
          npc_dialogue: Too early. I'm still watching.
          npc_tone: defensive
          npc_mood_after: content
    checks: *intro_checks
  - id: intro-jordan
    arrange_npc_locations: { jordan: flame_deck }
    action:
      kind: introduce_to
      target_id: jordan
      intent_id: intro_banter
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: You planning to let anyone else talk?
          npc_dialogue: Eventually. I haven't finished my opening statement.
          npc_tone: playful
          npc_mood_after: happy
    checks: *intro_checks
  - id: opening-couple-chloe
    action:
      kind: pair
      target_id: chloe
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: Blake, Chloe, Jordan, Liam, Marcus, Maya, Nia, Sophie, and you wait around the Flame Deck.
            You choose Chloe, and she takes the place beside you. The first couple is set.
    checks:
      - event_narration_valid
      - agent_traces_present
