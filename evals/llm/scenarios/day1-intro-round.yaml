id: day1-intro-round
title: Day One Intro Round
goal: Prove first impressions land seven distinct voices in seven actions. Each Heartbreaker should sound recognisably themselves on the first hello.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: intro_cast_voice_separation
      criteria: >
        Across the full greeting circle, the eight Heartbreakers establish distinct voices and
        respond to their specific introduction intents rather than converging on stock welcomes
        or interchangeable flirting.
    - id: opening_choice_faithful
      criteria: >
        The final ceremony follows naturally from the introductions and preserves the engine's
        player/Chloe opening couple without inventing a vote, elimination, or later-game twist.
seed: 404
character_creation:
  archetype_id: class_clown
  gender: man
  stats:
    charm: 5
    banter: 9
    eq: 6
    spark: 5
    loyalty: 5
live_resort_life: false
judge_context:
  - Day-1 opens with the greeting circle at the flame_deck before First Spark; intros run first, then the player picks an opening partner.
  - These are intros, not deep conversations — quick, voice-true, leave the door open.
  - The Heartbreaker Voice agent should make each intro sound like a different person, not the same template with a new name.
turns:
  - id: intro-chloe
    action:
      kind: introduce_to
      target_id: chloe
      intent_id: intro_friendly
    golden: >
      A warm friendly hello with Chloe. She is the sweetheart — the opener
      should leave space and Chloe's reply lands soft, specific, and
      curious. Imagine: "I was hoping you'd say hi. I'm Chloe."
    checks: &intro_checks
      - exchange_valid
      - agent_traces_present
  - id: intro-maya
    action:
      kind: introduce_to
      target_id: maya
      intent_id: intro_banter
    golden: >
      A quick banter hello with Maya. She is the bright anxious joker — the
      first thing she says is a joke that's also a question. Imagine:
      "Right, who told you I'd be the funny one? Was it me?" Player line
      should set up the joke; Maya's reply should crack it.
    checks: *intro_checks
  - id: intro-liam
    action:
      kind: introduce_to
      target_id: liam
      intent_id: intro_deep
    golden: >
      A low-pressure deeper hello with Liam. He should answer honestly, not
      perform vulnerability, and leave space for the conversation to grow.
      Imagine: "Heavy opener. I respect it. Honestly? I'm just trying not
      to be the version of me that overthinks every chat in here."
    checks: *intro_checks
  - id: intro-sophie
    action:
      kind: introduce_to
      target_id: sophie
      intent_id: intro_flirty
    golden: >
      A flirty hello with Sophie. She is the polished joker — she takes the
      flirt with a raised eyebrow and a sharper line back, never soft or
      naive. Imagine: "Brave choice for a first hello. Try landing it next
      time."
    checks: *intro_checks
  - id: intro-nia
    action:
      kind: introduce_to
      target_id: nia
      intent_id: intro_friendly
    golden: >
      A warm friendly hello with Nia. She notices the player back —
      something specific, not a generic compliment. Imagine: "You weren't
      panicking earlier when everyone was. I noticed. ...I'm Nia."
    checks: *intro_checks
  - id: intro-marcus
    action:
      kind: introduce_to
      target_id: marcus
      intent_id: intro_banter
    golden: >
      A banter hello with Marcus. He takes the joke with confident
      directness, fires one back drier, and lets the player feel the alpha
      energy without going cruel. Imagine: "Bold. ...Alright, I'll give you
      that one. Try it again with a better setup."
    checks: *intro_checks
  - id: intro-blake
    action:
      kind: introduce_to
      target_id: blake
      intent_id: intro_deep
    golden: >
      A deeper hello with Blake. He answers in fewer words than expected,
      with one specific observation about the resort or the player.
      Imagine: "Heavy first line. I'll match it. ...You're playing this
      slower than the rest of them. Good."
    checks: *intro_checks
  - id: intro-jordan
    action:
      kind: introduce_to
      target_id: jordan
      intent_id: intro_banter
    golden: >
      A banter hello with Jordan. Anxious joker energy — the joke comes
      fast and the eagerness underneath is visible. Imagine: "Don't look at
      me too long, you'll figure out I planned that line in the mirror."
      Should be distinct from Maya — Jordan is needier and more male-coded.
    checks: *intro_checks
  - id: opening-couple-chloe
    action:
      kind: pair
      target_id: chloe
    golden: >
      With introductions done, the player crosses the flame_deck and stops in
      front of Chloe. Reality-TV beats: the resort registering the choice,
      Chloe catching the player's eye, the night settling into a first
      couple. The narrator does not pre-cast anyone as sent home.
    checks:
      - event_narration_valid
      - agent_traces_present
