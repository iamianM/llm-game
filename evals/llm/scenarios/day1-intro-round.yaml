id: day1-intro-round
title: Day One Intro Round
goal: Prove first impressions land seven distinct voices in seven actions. Each Heartbreaker should sound recognisably themselves on the first hello.
seed: 404
character_creation:
  archetype_id: class_clown
  gender: man
  stats:
    charm: 5
    banter: 9
    eq: 6
    graft: 5
    loyalty: 5
live_villa_life: false
judge_context:
  - Day-1 opens with the greeting circle at the firepit before First Spark; intros run first, then the player picks an opening partner.
  - These are intros, not deep conversations — quick, voice-true, leave the door open.
  - The Islander Voice agent should make each intro sound like a different person, not the same template with a new name.
turns:
  - id: intro-chloe
    action:
      kind: introduce_to
      target_id: chloe
      intent_id: intro_friendly
    golden: >
      A warm friendly hello with Chloe. She is the sweetheart — the opener
      should leave space and Chloe's reply lands soft, specific, and
      curious. Imagine: "I was hoping you'd say hi. I'm Chloe."
    checks: &intro_checks
      - exchange_valid
      - agent_traces_present
    judge_checks:
      - id: chloe_intro_specific
        criteria: >
          Chloe sounds warm, specific, and a touch shy; fail if she reads as
          flirty alpha or generic sweetheart filler.
  - id: intro-maya
    action:
      kind: introduce_to
      target_id: maya
      intent_id: intro_banter
    golden: >
      A quick banter hello with Maya. She is the bright anxious joker — the
      first thing she says is a joke that's also a question. Imagine:
      "Right, who told you I'd be the funny one? Was it me?" Player line
      should set up the joke; Maya's reply should crack it.
    checks: *intro_checks
    judge_checks:
      - id: maya_intro_specific
        criteria: >
          Maya treats this as banter, not a flirt or a friendship baseline,
          and sounds bright and quick rather than soft or shy.
  - id: intro-liam
    action:
      kind: introduce_to
      target_id: liam
      intent_id: intro_deep
    golden: >
      A low-pressure deeper hello with Liam. He should answer honestly, not
      perform vulnerability, and leave space for the conversation to grow.
      Imagine: "Heavy opener. I respect it. Honestly? I'm just trying not
      to be the version of me that overthinks every chat in here."
    checks: *intro_checks
    judge_checks:
      - id: liam_intro_specific
        criteria: >
          Liam sounds grounded and thoughtful with a real beat of his own;
          fail if he tilts romantic-female or shallow banter.
  - id: intro-sophie
    action:
      kind: introduce_to
      target_id: sophie
      intent_id: intro_flirty
    golden: >
      A flirty hello with Sophie. She is the polished joker — she takes the
      flirt with a raised eyebrow and a sharper line back, never soft or
      naive. Imagine: "Brave choice for a first hello. Try landing it next
      time."
    checks: *intro_checks
    judge_checks:
      - id: sophie_intro_specific
        criteria: >
          Sophie sounds confident, dry, and high-agency, treating the flirt
          as a serve to return. Fail if she becomes timid or saccharine.
  - id: intro-nia
    action:
      kind: introduce_to
      target_id: nia
      intent_id: intro_friendly
    golden: >
      A warm friendly hello with Nia. She notices the player back —
      something specific, not a generic compliment. Imagine: "You weren't
      panicking earlier when everyone was. I noticed. ...I'm Nia."
    checks: *intro_checks
    judge_checks:
      - id: nia_intro_specific
        criteria: >
          Nia returns a specific observation about the player; fail if she
          gives a stock greeting or turns flirty.
  - id: intro-marcus
    action:
      kind: introduce_to
      target_id: marcus
      intent_id: intro_banter
    golden: >
      A banter hello with Marcus. He takes the joke with confident
      directness, fires one back drier, and lets the player feel the alpha
      energy without going cruel. Imagine: "Bold. ...Alright, I'll give you
      that one. Try it again with a better setup."
    checks: *intro_checks
    judge_checks:
      - id: marcus_intro_specific
        criteria: >
          Marcus reads as confident and direct; fail if he sounds insecure,
          cruel, or indistinguishable from Liam or Blake.
  - id: intro-blake
    action:
      kind: introduce_to
      target_id: blake
      intent_id: intro_deep
    golden: >
      A deeper hello with Blake. He answers in fewer words than expected,
      with one specific observation about the villa or the player.
      Imagine: "Heavy first line. I'll match it. ...You're playing this
      slower than the rest of them. Good."
    checks: *intro_checks
    judge_checks:
      - id: blake_intro_specific
        criteria: >
          Blake sounds thoughtful and restrained with a specific read; fail
          if he becomes romantic, generic, or sounds like Liam or Marcus.
  - id: intro-jordan
    action:
      kind: introduce_to
      target_id: jordan
      intent_id: intro_banter
    golden: >
      A banter hello with Jordan. Anxious joker energy — the joke comes
      fast and the eagerness underneath is visible. Imagine: "Don't look at
      me too long, you'll figure out I planned that line in the mirror."
      Should be distinct from Maya — Jordan is needier and more male-coded.
    checks: *intro_checks
    judge_checks:
      - id: jordan_intro_specific
        criteria: >
          Jordan sounds eager and self-deprecating under the banter; fail if
          he sounds identical to Maya or like a generic flirt.
  - id: opening-couple-chloe
    action:
      kind: recouple
      target_id: chloe
    golden: >
      With introductions done, the player crosses the firepit and stops in
      front of Chloe. Reality-TV beats: the villa registering the choice,
      Chloe catching the player's eye, the night settling into a first
      couple. The narrator does not pre-cast anyone as dumped.
    checks:
      - event_narration_valid
      - agent_traces_present
    judge_checks:
      - id: opening_choice_preserved
        criteria: >
          The narration names the player choosing Chloe and never invents a
          different partner, a vote, a dumping, or a Flush of Hearts twist.
