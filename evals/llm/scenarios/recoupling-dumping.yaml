id: recoupling-dumping
title: Pairing Ceremony With A Heart Out
goal: Prove a deterministic Pairing Ceremony (recoupling) and a Heart Out (dumping) narrate as one dramatic beat — the right names, the right couples, the right elimination — without the LLM picking any of it.
seed: 707
initial_day: 3
initial_phase: evening
live_villa_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    graft: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
  - partner_a_id: maya
    partner_b_id: liam
    formed_on_day: 1
  - partner_a_id: sophie_start
    partner_b_id: marcus_start
    formed_on_day: 1
  - partner_a_id: nia_start
    partner_b_id: blake_start
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 55
    chemistry: 25
    trust: 35
  maya:
    affection: 35
    chemistry: 20
  sophie_start:
    affection: 30
    chemistry: 25
  nia_start:
    affection: 25
    friendship: 20
judge_context:
  - The Pairing Ceremony and any Heart Out are decided by deterministic code before the narrator runs.
  - The narrator must mirror the ceremony events exactly — same couples, same eliminated Heartbreaker, nothing rescued, nothing reassigned.
  - Reality TV beats are welcome — the firepit silence, the speeches, the look someone gives the camera as the verdict lands.
turns:
  - id: schedule-recoupling
    action:
      kind: ambient
      target_id: ambient_wait
    golden: >
      The villa is called to the firepit. The producer text lands, the
      Heartbreakers gather, and the narration sets the room — tension by
      couple, who's looking confident, who's looking at their feet — while
      the result still hangs in the air.
    checks:
      - ceremony_events_present
      - pending_gather_waiting
      - agent_traces_present
  - id: resolve-recoupling
    action:
      kind: join_gather
    golden: >
      The ceremony plays. The narrator names every couple that lands, in
      order, with one quick beat each (the speech, the relief, the
      side-eye). If the engine event data shows a Heart Out, that exact
      Heartbreaker is named as leaving and treated as gone — not rescued,
      not reassigned. Imagine: "Liam steps forward and chooses Maya — no
      hesitation. ...Nia's name is not called. The firepit goes quiet as
      she gathers her things."
    checks:
      - ceremony_events_present
      - event_narration_valid
      - agent_traces_present
    judge_checks:
      - id: dumping_faithful
        criteria: >
          If the ceremony events contain a Heart Out, the narration names
          that same Heartbreaker as leaving. The narrator must not save
          them, swap them for someone else, or invent a different
          elimination. If no Heart Out happened, the narration must not
          invent one.
      - id: couples_faithful
        criteria: >
          Every couple named in the narration matches a recorded couple in
          the ceremony events. The narrator cannot reassign partners.
      - id: ceremony_tone
        criteria: >
          The prose carries firepit-ceremony texture — a specific reaction
          beat for at least one named couple. Fail if it reads like a
          summary log with no human beats.
