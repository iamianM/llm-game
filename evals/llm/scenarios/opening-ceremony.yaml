id: opening-ceremony
title: First Spark Narration
question: Can the opening feel memorable without changing the player's choice?
category: pairing_and_endings
goal: Prove the Event Narrator turns a deterministic First Spark into a moment the player remembers — without rewriting who they chose.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: first_spark_story_faithful
      criteria: >
        The ceremony must preserve the player/Chloe choice and name the full active cast required by
        the event. It should make Chloe's immediate response small and believable, without assigning
        jealousy, disappointment, motives, or private feelings to anyone else. It must not invent an
        alternate partner, elimination, vote, or later-game twist. Another cast member may be shown
        standing at the ceremony, but does not need a reaction.
seed: 101
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 9
    banter: 6
    eq: 5
    spark: 5
    loyalty: 5
live_resort_life: false
judge_context:
  - The engine has already decided the opening couple. The narrator only describes the moment.
  - The flame deck and one restrained, observable response are enough to make the choice visible.
  - The narrator must not invent eliminations, votes, heart_throb arrivals, or a different partner.
turns:
  - id: couple-with-chloe
    action:
      kind: pair
      target_id: chloe
    golden:
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: >
            Blake, Jordan, Liam, Marcus, Maya, Nia, and Sophie watch from the flame deck as you stop
            in front of Chloe. She takes a breath, then lets a small smile show. Your choice is set: you
            and Chloe are the new couple.
    checks:
      - event_narration_valid
      - agent_traces_present
