id: private-chat-success
title: Private Chat (Success)
question: Can a successful private chat cleanly transfer the conversation to the player?
category: social_dynamics
goal: Prove a successful private chat cleanly closes the NPC-NPC conversation and hands the player a normal first exchange with the Heartbreaker — without the LLM choosing the outcome.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: private_chat_success_grounded
      criteria: >
        Maya acknowledges leaving Liam, gives the player her attention, and responds to the reason
        she was invited away. The generated choices continue this exchange and survive into the
        player-facing menu alongside a graceful exit. Compare choices by their meaning, not exact labels.
        Do not grade the curator's prose: this fixture supplies no Maya-Liam exchange history, and the
        deterministic checks separately prove that their conversation closed.
      pass_examples:
        - Maya says Liam's analysis was boring, holds the player's gaze, and says the player has her attention.
seed: 2
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: class_clown
  gender: man
  stats:
    charm: 5
    banter: 9
    eq: 6
    spark: 5
    loyalty: 5
initial_relationships:
  maya:
    affection: 40
    chemistry: 10
    friendship: 15
initial_npc_conversations:
  - id: npcconv_maya_liam_pool
    participants:
      - maya
      - liam
    location_id: pool
    topic: Maya and Liam comparing notes on the early couples
    started_on_turn: 0
    status: active
judge_context:
  - Maya and Liam are mid-conversation at the pool when the player walks up.
  - The private chat and opening intent are engine-decided; the seed and stats are set so both succeed here.
  - On success the NPC-NPC conversation closes and the player gets a normal start_conversation beat with Maya.
turns:
  - id: private-chat-maya
    arrange_player_location: pool
    arrange_npc_locations:
      maya: pool
      liam: pool
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_intimate_eye_contact
    golden:
      calls:
      - agent: conversation_curator
        output_type: MemoryBatch
        output:
          kind: background
          memories: []
          summary: ''
          gossip_seeds: []
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: I know I cut in, but I wanted to talk to you.
          npc_dialogue: Then talk. Liam can wait a minute.
          npc_tone: flirty
          npc_mood_after: flirty
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Ask if she minded
            category: deep
            intent_kind: ask_about_topic
            stat_used: eq
            risk: low
            tone: curious and attentive
            audience_hint: +
            reveal_tier: 1
            reveal_tag: wanted_private_chat
            unlock_threshold: null
          - label: Tell her why you asked
            category: supportive
            intent_kind: supportive_validate
            stat_used: eq
            risk: safe
            tone: warm and grounding
            audience_hint: +
            reveal_tier: 0
            reveal_tag: direct_interest
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks:
      - private_chat_recorded
      - private_chat_succeeded
      - npc_conversation_closed
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
