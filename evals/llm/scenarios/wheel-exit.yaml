id: wheel-exit
title: Conversation Wheel Exit
question: Can leaving through dialogue feel voiced and preserve memories?
category: conversation
goal: Prove choosing the exit option from a conversation wheel is a voiced, graceful close with curator review, not the same path as the top-level walk-away action.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: wheel_exit_social_close
      criteria: >
        The exchange makes the selected wheel exit a warm, intentional goodbye tied to the current
        moment. The curator should keep only a detail that can affect a later scene. A vague "chat
        later" or "see you around" is not a promise; only a specific plan, time, or commitment needs
        memory. An NPC's immediate exit activity, such as claiming a lounger, does not need memory
        unless it creates a future player-NPC commitment. The reviewed coffee detail is one valid
        reference, not a required story fact; judge the actual exchange on what it establishes. If the
        actual goodbye creates no specific plan, an empty memory list is correct and must not fail. Fail
        on an abrupt cancel, biography filler, inflated memory, or unresolved conversation.
seed: 2121
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  chloe:
    affection: 45
    chemistry: 20
    trust: 30
    friendship: 25
judge_context:
  - The active conversation already has a legal wheel with one exit option.
  - This scenario selects the exit option itself, not the top-level end_conversation action.
  - A wheel exit should produce a goodbye exchange, apply the exit delta, curate memories, and close the active conversation.
turns:
  - id: choose-wheel-exit
    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
    arrange_active_conversation:
      target_id: chloe
      started_on_turn: 0
      started_on_day: 1
      pending_options:
        npc_will_leave: false
        options:
          - label: Ask what she really wants from the resort
            category: deep
            intent_kind: ask_future
            stat_used: eq
            risk: low
            tone: warm
          - label: End on a good note
            category: exit
            intent_kind: end_softly
            stat_used: null
            risk: safe
            tone: warm
    action:
      kind: respond_with
      target_id: chloe
      intent_id: end_softly
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: I'm getting breakfast. Want anything?
          npc_dialogue: Coffee, please. I'll find you later.
          npc_tone: warm
          npc_mood_after: content
      - agent: conversation_curator
        output_type: MemoryBatch
        output:
          kind: player
          memories:
          - holder_id: chloe
            subject_id: player
            content: The player said she would bring me a coffee after breakfast.
            source: direct
            source_id: null
            emotional_weight: 2
            tags:
            - coffee
            - follow_up
            durable: false
          summary: The player left for breakfast and offered to bring Chloe a coffee.
          gossip_seeds: []
    checks:
      - exchange_valid
      - conversation_closed
      - relationship_delta:chloe:trust:1
      - curator_batch_recorded
      - agent_traces_present
