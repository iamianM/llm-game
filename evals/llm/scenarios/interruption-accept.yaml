id: interruption-accept
title: Conversation Interruption (Accept)
question: Can an accepted interruption apply both consequences and continue with the new speaker?
category: social_dynamics
goal: Prove accepting an interruption closes the current chat, applies both relationship consequences, starts a new conversation with the interrupter, and voices the new exchange.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: interruption_handoff_grounded
      criteria: >
        The complete beat must read as one social handoff. The empty Chloe conversation produces no
        invented memory or curator call, then Liam becomes the active speaker. His exchange and
        follow-up menu must acknowledge that handoff, not begin a generic new chat, reject him,
        continue with Chloe, or invent a reaction from Chloe.
seed: 1920
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: class_clown
  gender: woman
  stats:
    charm: 6
    banter: 9
    eq: 5
    spark: 5
    loyalty: 5
initial_relationships:
  chloe:
    affection: 45
    chemistry: 20
    trust: 30
    friendship: 20
  liam:
    affection: 35
    chemistry: 15
    trust: 25
    friendship: 25
judge_context:
  - The player is mid-conversation with Chloe at the pool; Liam walks up with a polite interruption.
  - Accepting the interruption is the only interruption response that swaps the active conversation to the interrupter and calls Heartbreaker Voice.
  - The engine applies the social cost to Chloe and the boost to Liam before the LLM writes the new exchange.
turns:
  - id: accept-liam
    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
      liam: pool
    arrange_active_conversation:
      target_id: chloe
      started_on_turn: 0
      started_on_day: 1
      pending_interruption:
        interrupter_id: liam
        reason: needs_to_talk
        urgency: polite
    action:
      kind: respond_with
      target_id: liam
      intent_id: accept_interruption
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: You wanted something?
          npc_dialogue: Yeah. Sorry for cutting in. Can we talk?
          npc_tone: warm
          npc_mood_after: content
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Ask what's up
            category: friendly
            intent_kind: ask_about_topic
            stat_used: eq
            risk: low
            tone: curious
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          - label: Tell him it's fine
            category: supportive
            intent_kind: honest_vulnerable
            stat_used: charm
            risk: low
            tone: open
            audience_hint: +
            reveal_tier: 1
            reveal_tag: interruption_reaction
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks:
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - interruption_cleared
      - relationship_delta:chloe:affection:-2
      - relationship_delta:liam:affection:3
      - agent_traces_present
