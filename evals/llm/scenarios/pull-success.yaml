id: pull-success
title: Pull For Chat (Success)
goal: Prove a successful pull cleanly closes the NPC-NPC conversation and hands the player a normal first exchange with the pulled Heartbreaker — without the LLM choosing the outcome.
seed: 2
initial_location: pool
live_villa_life: false
character_creation:
  archetype_id: class_clown
  gender: man
  stats:
    charm: 5
    banter: 9
    eq: 6
    graft: 5
    loyalty: 5
initial_relationships:
  maya:
    affection: 40
    chemistry: 10
    friendship: 15
initial_npc_conversations:
  - id: npcconv_maya_liam_pool
    participants:
      - maya
      - liam
    location_id: pool
    topic: Maya and Liam comparing notes on the early couples
    started_on_turn: 0
    status: active
judge_context:
  - Maya and Liam are mid-conversation at the pool when the player walks up.
  - The pull and opening intent are engine-decided; the seed and stats are set so both succeed here.
  - On success the NPC-NPC conversation closes and the player gets a normal start_conversation beat with Maya.
turns:
  - id: pull-maya
    arrange_player_location: pool
    arrange_npc_locations:
      maya: pool
      liam: pool
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_intimate_eye_contact
    golden: >
      The player walks up to Maya at the pool and pulls her cleanly out of
      the chat with Liam. The opening exchange should feel like Maya was
      flattered to be pulled — a quick acknowledgment that she was
      mid-conversation, then real attention on the player. Imagine: "Bold
      move in front of Liam. ...Alright, you've got me. Make it worth it."
    checks:
      - pull_recorded
      - pull_succeeded
      - npc_conversation_closed
      - exchange_valid
      - follow_up_menu_valid
      - exactly_one_exit
      - conversation_active
      - agent_traces_present
      - no_agent_validation_retries
    judge_checks:
      - id: pull_acknowledged
        criteria: >
          Maya's reply acknowledges (directly or indirectly) that the player
          just pulled her away from another chat. Fail if she behaves as if
          this is a cold open with no prior context.
      - id: maya_voice_fit
        criteria: >
          Maya sounds bright, quick, and a little nervy under the bravado.
          Fail if she becomes a soft sweetheart or a cold strategist.
      - id: followups_playable
        criteria: >
          The follow-up menu offers concrete continuations of this pulled
          moment (escalate, banter back, pull back gracefully) and one exit.
