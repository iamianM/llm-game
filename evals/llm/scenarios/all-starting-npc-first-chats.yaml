id: all-starting-npc-first-chats
title: First Chat With Every Starting NPC
question: Can every contestant sound distinct from the first conversation?
category: conversation
goal: Prove Heartbreaker Voice, Contextual Options, and Curator give every starting Heartbreaker a distinct, voice-true first conversation that earns the player wanting to come back.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: cast_voice_separation
      criteria: >
        Across the complete round, the Heartbreakers retain distinct social instincts and ways of
        handling the player's intent without becoming caricatures. Shared ordinary words are not a
        failure. Fail when three or more replies reuse the same full template, several characters
        lose their supplied voice direction, or a first chat turns into a résumé or family-history dump.
    - id: conversation_surfaces_playable
      criteria: >
        Every reply answers the exact opening line. Each model-authored follow-up responds to a visible
        subject or stance and differs meaningfully from the other choice; a natural implication is
        acceptable. The engine-provided exit remains available. A separate engine-added gossip choice
        is valid when its intent_kind names a stored memory; do not attribute that choice to Contextual
        Options. Fail model-authored choices that introduce an unseen person, event, or private biography,
        repeat one choice in two tones, or disconnect from the exchange.
    - id: curator_restraint
      criteria: >
        Judge each close-turn curator against the reviewed chat replayed directly before that close,
        not against the separate actual chat target. Routine first-chat banter should not become durable
        memory. Empty batches are correct for thin exchanges. Any memory that is returned must preserve
        a concrete useful fact from that reviewed chat and the correct holder's perspective. Fail mirrored
        memories, generic connection summaries, or inflated emotional weight.
