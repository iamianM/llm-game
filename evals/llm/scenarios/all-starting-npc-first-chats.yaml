    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
    action:
      kind: start_conversation
      target_id: chloe
      intent_id: friendly_ask_feelings
    golden:
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: Bit much, this, isn't it?
          npc_dialogue: A little. I'm hiding by the tea until I learn everyone's names.
          npc_tone: warm
          npc_mood_after: content
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Ask about the tea
            category: friendly
            intent_kind: ask_about_topic
            stat_used: eq
            risk: low
            tone: curious
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          - label: Stay out of the crowd
            category: supportive
            intent_kind: supportive_reassure
            stat_used: loyalty
            risk: safe
            tone: warm and reassuring
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks: &conversation_checks
      - mechanical_success
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
  - id: close-chloe
    action: &end_action
      kind: end_conversation
    golden:
      calls:
      - agent: conversation_curator
        output_type: MemoryBatch
        output:
          kind: player
          memories: []
          summary: The player and Chloe ended a brief first chat about finding space away from the crowd.
          gossip_seeds: []
    checks: &close_checks
      - conversation_closed
      - curator_batch_recorded
      - agent_traces_present
