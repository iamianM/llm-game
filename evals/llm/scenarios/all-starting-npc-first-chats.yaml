id: all-starting-npc-first-chats
title: First Chat With Every Starting NPC
goal: Prove Islander Voice, Contextual Options, and Curator give every starting Heartbreaker a distinct, voice-true first conversation that earns the player wanting to come back.
seed: 303
live_villa_life: false
initial_phase_budget_minutes: 240
initial_relationships:
  chloe:
    affection: 20
    trust: 10
    friendship: 10
  jordan_start:
    affection: 18
    friendship: 18
  maya:
    affection: 25
    chemistry: 10
    friendship: 15
  marcus_start:
    affection: 20
    friendship: 20
  liam:
    affection: 45
    trust: 20
    friendship: 20
  nia_start:
    affection: 20
    trust: 15
    friendship: 15
  sophie_start:
    affection: 25
    chemistry: 10
    trust: 10
  blake_start:
    affection: 20
    friendship: 20
judge_context:
  - This is a launch-cast breadth scenario; the bar is "would the player want to keep talking to this Heartbreaker?", not finale-level depth.
  - Each chat should land a specific opening beat for that NPC, not the same warm greeting refitted with a different name.
  - Endings should leave a clean memory trail; the engine, not the LLM, owns relationship deltas.
  - Live villa autonomy is disabled here so every target stays put; Villa Orchestrator + Background Dialogue are covered by separate scenarios.
turns:
  - id: chat-chloe
    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
    action:
      kind: start_conversation
      target_id: chloe
      intent_id: friendly_ask_feelings
    golden: >
      A grounded sincere check-in by the pool. Chloe is the secure sweetheart;
      she should be visibly pleased someone asked, give a real answer (a beat
      she's been sitting with), and ask back. Imagine: "Honestly? I've been
      trying to figure out who's actually paying attention in here. You count."
      Follow-ups should offer Go Deeper, Tease Lightly, and a clean Exit.
    checks: &conversation_checks
      - exchange_valid
      - follow_up_menu_valid
      - exactly_one_exit
      - conversation_active
      - agent_traces_present
      - no_agent_validation_retries
    judge_checks:
      - id: target_specific
        criteria: >
          The exchange addresses Chloe specifically and never drifts onto another
          Heartbreaker's voice or topic.
      - id: intent_specific
        criteria: >
          Chloe answers the emotional check-in directly (a real feeling, a
          real beat) rather than producing a generic greeting or pivoting to
          strategy talk.
      - id: chloe_voice_fit
        criteria: >
          Chloe reads as warm, secure, and quietly curious — happy to be
          checked on without making it weighty. Fail if she becomes icy,
          chaotic, performatively sad, or sounds like a different archetype.
      - id: followups_playable
        criteria: >
          The follow-up menu offers concrete continuations of this beat
          (deeper share, light tease, gentle redirect) plus exactly one exit,
          with no placeholder or duplicate options.
  - id: close-chloe
    action: &end_action
      kind: end_conversation
    golden: >
      A warm soft close. Each memory should be first-person — the player
      remembering "I asked Chloe how she was, she let me in a little," and
      Chloe remembering being seen.
    checks: &close_checks
      - conversation_closed
      - curator_memories
      - agent_traces_present
      - no_agent_validation_retries
    judge_checks: &memory_judges
      - id: memory_faithful
        criteria: >
          Each memory is first-person for its holder, names the other
          participant, summarizes a beat that actually happened in the visible
          exchange, and never invents off-screen events or unrevealed traits.
  - id: chat-jordan
    arrange_player_location: pool
    arrange_npc_locations:
      jordan_start: pool
    action:
      kind: start_conversation
      target_id: jordan_start
      intent_id: bromance_check_in
    golden: >
      A bro-energy pool check-in. Jordan is the anxious joker — under the
      grin he wants to feel chosen. The exchange should land a quick laugh
      and then a tiny crack of honesty he'd never lead with. Imagine:
      "Mate, I've been on form, obviously. ...Okay, fine, I keep waiting
      for someone to actually pull me for a chat. You're the first."
    checks: *conversation_checks
    judge_checks:
      - id: jordan_voice_fit
        criteria: >
          Jordan sounds playful and a touch eager underneath the banter,
          recognisably male, and never slides into a romantic female voice or
          a generic flirt template.
      - id: intent_specific
        criteria: >
          The exchange treats this as a bromance check-in (mate-to-mate),
          not a flirt or a strategy briefing.
      - id: followups_playable
        criteria: >
          Follow-ups give concrete bromance continuations (joke back, ask
          what's really up, plan something) and one clean exit.
  - id: close-jordan
    action: *end_action
    golden: >
      Memories should capture the small honest beat under Jordan's joke,
      not just "we chatted by the pool".
    checks: *close_checks
    judge_checks: *memory_judges
  - id: move-kitchen
    arrange_npc_locations:
      maya: kitchen
      marcus_start: kitchen
    action:
      kind: move
      target_id: kitchen
    golden: >
      The player walks into the kitchen; Maya and Marcus are now in earshot.
    checks:
      - location_is:kitchen
      - visible_targets_include:maya,marcus_start
  - id: chat-maya
    arrange_player_location: kitchen
    arrange_npc_locations:
      maya: kitchen
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_compliment_looks
    golden: >
      An unsubtle compliment lands in a kitchen full of light. Maya is the
      bright anxious joker — she takes the flirt with a grin, deflects with
      a joke, and then lets a real flicker of interest show. Imagine:
      "Wait, are we doing this in front of the toaster? Bold. ...Say that
      again, slower." Menu should offer escalate-flirt, banter-back, and
      one exit.
    checks: *conversation_checks
    judge_checks:
      - id: maya_voice_fit
        criteria: >
          Maya reads bright, quick, and a little nervy under the bravado.
          Fail if she becomes a soft sweetheart, a cold strategist, or
          ignores the compliment entirely.
      - id: intent_specific
        criteria: >
          The exchange treats the compliment as flirtation, not friendship,
          gossip, or a status check.
      - id: followups_playable
        criteria: >
          Menu offers concrete escalate/banter continuations and one exit;
          no placeholders.
  - id: close-maya
    action: *end_action
    golden: >
      Memories should reflect a flirty kitchen beat, not a generic chat —
      Maya remembers being looked at, the player remembers the line that
      worked.
    checks: *close_checks
    judge_checks: *memory_judges
  - id: chat-marcus
    arrange_player_location: kitchen
    arrange_npc_locations:
      marcus_start: kitchen
    action:
      kind: start_conversation
      target_id: marcus_start
      intent_id: bromance_rib
    golden: >
      A light ribbing between two guys. Marcus is the confident heartthrob —
      he takes the joke without bristling, fires one back drier, and reveals
      the small thing he actually cares about (his nephew, his gym schedule,
      the way he reads people). Imagine: "You think I don't see it? I see
      it. Try harder, mate."
    checks: *conversation_checks
    judge_checks:
      - id: marcus_voice_fit
        criteria: >
          Marcus sounds confident and direct, taking the ribbing without
          insecurity. Fail if he becomes timid, cruel, or indistinguishable
          from Liam or Blake.
      - id: intent_specific
        criteria: >
          The exchange treats this as bromance ribbing — competitive but
          friendly, not strategy talk or a flirt.
      - id: followups_playable
        criteria: >
          Menu offers concrete bromance continuations (escalate the rib,
          shift to honest, change topic) and one exit.
  - id: close-marcus
    action: *end_action
    golden: >
      Memories capture the moment Marcus actually let his guard drop a
      half-inch — the throwaway truth under the swagger.
    checks: *close_checks
    judge_checks: *memory_judges
  - id: move-terrace
    arrange_npc_locations:
      liam: terrace
      nia_start: terrace
    action:
      kind: move
      target_id: terrace
    golden: >
      The player walks to the terrace; Liam and Nia are now in earshot.
    checks:
      - location_is:terrace
      - visible_targets_include:liam,nia_start
  - id: chat-liam
    arrange_player_location: terrace
    arrange_npc_locations:
      liam: terrace
    action:
      kind: start_conversation
      target_id: liam
      intent_id: deep_ask_life
    golden: >
      A real conversation on the terrace. Liam is the grounded sweetheart —
      he answers the deeper question honestly, doesn't perform, and turns the
      question back in a way that respects the player. Imagine: "I think
      about it more than I'd admit. Teaching is small. I want it to mean
      more. ...what about you, why are you really here?"
    checks: *conversation_checks
    judge_checks:
      - id: liam_voice_fit
        criteria: >
          Liam sounds grounded, thoughtful, recognisably male, and willing
          to be a little vulnerable. Fail if he tilts romantic-female,
          becomes shallow banter only, or sounds like Marcus or Blake.
      - id: intent_specific
        criteria: >
          The exchange responds to a deeper life question with a real
          answer, not a deflection or a flirt.
      - id: followups_playable
        criteria: >
          Menu offers concrete ways to go deeper, lighten, or close out
          warmly. One clear exit.
  - id: close-liam
    action: *end_action
    golden: >
      Memories should capture a chunk of substance — the actual thing Liam
      said about meaning, not "we talked on the terrace".
    checks: *close_checks
    judge_checks: *memory_judges
  - id: chat-nia
    arrange_player_location: terrace
    arrange_npc_locations:
      nia_start: terrace
    action:
      kind: start_conversation
      target_id: nia_start
      intent_id: friendly_compliment_personality
    golden: >
      A genuine personality compliment, returned with grace. Nia is the
      observant warm friend — she notices the compliment is real, smiles,
      and gives back a specific observation about the player she's been
      sitting on. Imagine: "That's a kind thing to say. ...Can I tell you
      what I noticed about you, actually?"
    checks: *conversation_checks
    judge_checks:
      - id: nia_voice_fit
        criteria: >
          Nia sounds kind, observant, and steady, never sharp or chaotic.
          Fail if she becomes a flirt template, ignores the compliment, or
          turns suspicious.
      - id: intent_specific
        criteria: >
          The exchange treats the compliment as friendship, not flirtation,
          and gives a real specific observation back.
      - id: followups_playable
        criteria: >
          Menu offers concrete friendly continuations (ask back, share more,
          warm exit) and one clear exit.
  - id: close-nia
    action: *end_action
    golden: >
      Memories should capture Nia's specific observation about the player,
      not a generic "we connected".
    checks: *close_checks
    judge_checks: *memory_judges
  - id: move-bedroom
    arrange_npc_locations:
      sophie_start: bedroom
      blake_start: bedroom
    action:
      kind: move
      target_id: bedroom
    golden: >
      The player walks into the bedroom; Sophie and Blake are visible.
    checks:
      - location_is:bedroom
      - visible_targets_include:sophie_start,blake_start
  - id: chat-sophie
    arrange_player_location: bedroom
    arrange_npc_locations:
      sophie_start: bedroom
    action:
      kind: start_conversation
      target_id: sophie_start
      intent_id: banter_playful_roast
    golden: >
      Playful social sparring in the bedroom doorway. Sophie is the polished
      joker — she takes the roast like it's a serve, returns it sharper, and
      leaves the door open just enough that the player wants to come back.
      Imagine: "Cute. Six out of ten for setup, four for delivery. ...try me
      again later when you've had time to think."
    checks: *conversation_checks
    judge_checks:
      - id: sophie_voice_fit
        criteria: >
          Sophie sounds polished, quick, and high-agency. Fail if she becomes
          timid, generic, cruel, or shuts the moment down as a hard
          rejection.
      - id: intent_specific
        criteria: >
          The exchange treats the moment as playful banter, not a friendship
          baseline, life story, or flirt-as-compliment.
      - id: followups_playable
        criteria: >
          Menu offers concrete banter continuations (push the joke, switch
          to genuine, exit gracefully) and one clear exit.
  - id: close-sophie
    action: *end_action
    golden: >
      Memories should capture the specific bit of the roast that landed —
      the line, not a vague "we joked around".
    checks: *close_checks
    judge_checks: *memory_judges
  - id: chat-blake
    arrange_player_location: bedroom
    arrange_npc_locations:
      blake_start: bedroom
    action:
      kind: start_conversation
      target_id: blake_start
      intent_id: bromance_share_strategy
    golden: >
      A quiet read-the-room conversation. Blake is the dry observer — he
      gives a real strategic take in fewer words than expected, drops one
      sharp read of another Heartbreaker, and stops short of gossip. Imagine:
      "I'm watching Maya. Not for me, but she's the one to read this week.
      You should be watching her too."
    checks: *conversation_checks
    judge_checks:
      - id: blake_voice_fit
        criteria: >
          Blake sounds thoughtful, dry, recognisably male, and never tips
          into romantic intensity. Fail if he sounds like Liam, Marcus, or
          a generic warm-friend voice.
      - id: intent_specific
        criteria: >
          The exchange responds to "how are you reading the villa" with a
          specific strategic read, not a generic chat or a flirt.
      - id: followups_playable
        criteria: >
          Menu offers concrete strategy/bromance continuations (push for
          more, share back, switch tone) and one clear exit.
  - id: close-blake
    action: *end_action
    golden: >
      Memories should capture Blake's specific read — naming the
      Heartbreaker he flagged, not "Blake had thoughts".
    checks: *close_checks
    judge_checks: *memory_judges
