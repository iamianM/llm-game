judge_context:
  - This is a launch-cast breadth scenario; the bar is "would the player want to keep talking to this Heartbreaker?", not finale-level depth.
  - Each chat should land a specific opening beat for that NPC, not the same warm greeting refitted with a different name.
  - Goldens are illustrative targets, not checklists. Accept a different concrete detail or continuation when it serves the same intent and character voice.
  - Endings should leave a clean memory trail; the engine, not the LLM, owns relationship deltas.
  - >
    Memory ids are canonical sentinels: holder_id "player" is the player's first-person
    memory, while holder_id matching an NPC id is that NPC's first-person memory. For an
    NPC-held memory, subject_id "player" and the phrase "the player" correctly identify
    the other participant; do not reinterpret that as a player-held memory.
  - Live resort autonomy is disabled here so every target stays put; Resort Orchestrator + Background Dialogue are covered by separate scenarios.
turns:
  - id: chat-chloe
    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
    action:
      kind: start_conversation
      target_id: chloe
      intent_id: friendly_ask_feelings
    golden:
      criteria: 'A grounded sincere check-in by the pool. Chloe is the secure sweetheart; she should be visibly
        pleased someone asked and give a real answer (a beat she''s been sitting with). She may ask back when
        it fits. Imagine: "Honestly? I''ve been trying to figure out who''s actually paying attention in here.
        You count." Follow-ups should offer Go Deeper, Tease Lightly, and a clean Exit.'
      calls:
      - agent: heartbreaker_voice
        output_type: Exchange
        output:
          player_dialogue: How are you feeling this morning, Chloe? You seem cheerful, but I get the sense
            there’s something you’re keeping tucked away beneath the smiles.
          npc_dialogue: That’s a very kind thing to notice, love. I’m happy to be here, honestly, but my sister’s
            pregnancy has me wondering whether I want children before thirty—and that thought feels rather
            loud today. *smiles, then goes briefly still*
          npc_tone: vulnerable
          npc_mood_after: content
      - agent: contextual_options
        output_type: ContextualBespoke
        output:
          options:
          - label: Separate desire from deadline
            category: deep
            intent_kind: honest_vulnerable
            stat_used: eq
            risk: medium
            tone: gentle and candid
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          - label: Validate the sister pressure
            category: supportive
            intent_kind: supportive_validate
            stat_used: loyalty
            risk: safe
            tone: warm and reassuring
            audience_hint: +
            reveal_tier: 0
            reveal_tag: null
            unlock_threshold: null
          npc_will_leave: false
          npc_exit_line: null
    checks: &conversation_checks
      - mechanical_success
      - exchange_valid
      - follow_up_menu_valid
      - conversation_active
      - agent_traces_present
      - no_agent_validation_retries
  - id: close-chloe
    action: &end_action
      kind: end_conversation
    golden:
      criteria: A warm soft close. Each memory should be first-person — the player remembering "I asked Chloe
        how she was, she let me in a little," and Chloe remembering being seen.
      calls:
      - agent: conversation_curator
        output_type: MemoryBatch
        output:
          kind: player
          memories:
          - holder_id: player
            subject_id: chloe
            content: I noticed Chloe's cheerful smile go briefly still when she admitted that her sister's
              pregnancy had made the question of wanting children before thirty feel suddenly loud for her.
            source: direct
            source_id: null
            emotional_weight: 7
            tags:
            - vulnerable
            - supportive
            - sincere
            - felt_seen
            durable: true
          - holder_id: chloe
            subject_id: player
            content: I felt gently seen when the player noticed that my smiles were hiding something and asked
              how I was really feeling.
            source: direct
            source_id: null
            emotional_weight: 6
            tags:
            - supportive
            - sincere
            - trust_built
            - felt_seen
            durable: true
          - holder_id: jordan
            subject_id: chloe
            content: I saw Chloe's cheerful expression falter into a brief stillness during her serious conversation
              with the player.
            source: witnessed
            source_id: null
            emotional_weight: 4
            tags:
            - saw_them_close
            - vulnerable
            - witnessed
            durable: true
          summary: The player gently asked Chloe how she was feeling beneath her cheerful appearance. Chloe
            responded warmly but revealed that her sister's pregnancy had made her question whether she wants
            children before thirty, and the thought felt especially loud that morning. The conversation took
            on a sincere, vulnerable tone.
          gossip_seeds: []
    checks: &close_checks
      - conversation_closed
      - curator_memories
      - agent_traces_present
      - no_agent_validation_retries
