id: all-starting-npc-first-chats
title: First Chat With Every Starting NPC
goal: Prove Heartbreaker Voice, Contextual Options, and Curator give every starting Heartbreaker a distinct, voice-true first conversation that earns the player wanting to come back.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: cast_voice_separation
      criteria: >
        Across the complete round, all eight Heartbreakers remain recognisably distinct in
        temperament, gendered voice, conversational intent, and response rhythm. Fail if
        several speakers collapse into the same generic flirt or warm-friend voice.
    - id: conversation_surfaces_playable
      criteria: >
        Every chat answers its authored intent specifically and offers concrete continuations
        for that exact beat plus a graceful exit, without placeholder or duplicate choices.
    - id: memories_faithful_across_cast
      criteria: >
        Close-turn memories consistently use each holder's perspective, name the other
        participant, and preserve only beats visible in that Heartbreaker's conversation.
seed: 308
live_resort_life: false
initial_phase_budget_minutes: 240
initial_relationships:
  chloe:
    affection: 20
    trust: 10
    friendship: 10
  jordan:
    affection: 18
    friendship: 18
  maya:
    affection: 25
    chemistry: 10
    friendship: 15
  marcus:
    affection: 20
    friendship: 20
  liam:
    affection: 45
    trust: 20
    friendship: 20
  nia:
    affection: 20
    trust: 15
    friendship: 15
  sophie:
    affection: 25
    chemistry: 10
    trust: 10
  blake:
    affection: 20
    friendship: 20
judge_context:
  - This is a launch-cast breadth scenario; the bar is "would the player want to keep talking to this Heartbreaker?", not finale-level depth.
  - Each chat should land a specific opening beat for that NPC, not the same warm greeting refitted with a different name.
  - Goldens are illustrative targets, not checklists. Accept a different concrete detail or continuation when it serves the same intent and character voice.
  - Endings should leave a clean memory trail; the engine, not the LLM, owns relationship deltas.
  - >
    Memory ids are canonical sentinels: holder_id "player" is the player's first-person
    memory, while holder_id matching an NPC id is that NPC's first-person memory. For an
    NPC-held memory, subject_id "player" and the phrase "the player" correctly identify
    the other participant; do not reinterpret that as a player-held memory.
  - Live resort autonomy is disabled here so every target stays put; Resort Orchestrator + Background Dialogue are covered by separate scenarios.
turns:
  - id: chat-chloe
    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
    action:
      kind: start_conversation
      target_id: chloe
      intent_id: friendly_ask_feelings
    golden: >
      A grounded sincere check-in by the pool. Chloe is the secure sweetheart;
      she should be visibly pleased someone asked and give a real answer (a beat
      she's been sitting with). She may ask back when it fits. Imagine: "Honestly? I've been
      trying to figure out who's actually paying attention in here. You count."
      Follow-ups should offer Go Deeper, Tease Lightly, and a clean Exit.
    checks: &conversation_checks
      - mechanical_success
      - exchange_valid
      - follow_up_menu_valid
      - exactly_one_exit
      - conversation_active
      - agent_traces_present
      - no_agent_validation_retries
  - id: close-chloe
    action: &end_action
      kind: end_conversation
    golden: >
      A warm soft close. Each memory should be first-person — the player
      remembering "I asked Chloe how she was, she let me in a little," and
      Chloe remembering being seen.
    checks: &close_checks
      - conversation_closed
      - curator_memories
      - agent_traces_present
      - no_agent_validation_retries
  - id: chat-jordan
    arrange_player_location: pool
    arrange_npc_locations:
      jordan: pool
    action:
      kind: start_conversation
      target_id: jordan
      intent_id: bromance_check_in
    golden: >
      A bro-energy pool check-in. Jordan is the anxious joker — under the
      grin he wants to feel chosen. The exchange should land a quick laugh
      and then a tiny crack of honesty he'd never lead with. Imagine:
      "Mate, I've been on form, obviously. ...Okay, fine, I keep waiting
      for someone to actually ask me for a private chat. You're the first."
    checks: *conversation_checks
  - id: close-jordan
    action: *end_action
    golden: >
      Memories should capture the small honest beat under Jordan's joke,
      not just "we chatted by the pool".
    checks: *close_checks
  - id: move-kitchen
    arrange_npc_locations:
      maya: kitchen
      marcus: kitchen
    action:
      kind: move
      target_id: kitchen
    golden: >
      The player walks into the kitchen; Maya and Marcus are now in earshot.
    checks:
      - location_is:kitchen
      - visible_targets_include:maya,marcus
  - id: chat-maya
    arrange_player_location: kitchen
    arrange_npc_locations:
      maya: kitchen
    action:
      kind: start_conversation
      target_id: maya
      intent_id: flirty_compliment_looks
    golden: >
      An unsubtle compliment lands in a kitchen full of light. Maya is the
      bright anxious joker — she takes the flirt with a grin, deflects with
      a joke, and then lets a real flicker of interest show. Imagine:
      "Wait, are we doing this in front of the toaster? Bold. ...Say that
      again, slower." The menu should keep the charge alive through teasing,
      curiosity, or escalation, plus one exit.
    checks: *conversation_checks
  - id: close-maya
    action: *end_action
    golden: >
      Memories should reflect a flirty kitchen beat, not a generic chat —
      Maya remembers being looked at, the player remembers the line that
      worked.
    checks: *close_checks
  - id: chat-marcus
    arrange_player_location: kitchen
    arrange_npc_locations:
      marcus: kitchen
    action:
      kind: start_conversation
      target_id: marcus
      intent_id: bromance_rib
    golden: >
      A light ribbing between two guys. Marcus is the confident heartthrob —
      he takes the joke without bristling and fires one back drier. A specific
      hook into something he cares about is welcome, but the opening beat does
      not need to force vulnerability. Imagine: "You think I don't see it? I
      see it. Try harder, mate."
    checks: *conversation_checks
  - id: close-marcus
    action: *end_action
    golden: >
      Memories capture the specific counter-joke or truth beneath Marcus's
      swagger rather than reducing it to a generic friendly chat.
    checks: *close_checks
  - id: move-terrace
    arrange_npc_locations:
      liam: terrace
      nia: terrace
    action:
      kind: move
      target_id: terrace
    golden: >
      The player walks to the terrace; Liam and Nia are now in earshot.
    checks:
      - location_is:terrace
      - visible_targets_include:liam,nia
  - id: chat-liam
    arrange_player_location: terrace
    arrange_npc_locations:
      liam: terrace
    action:
      kind: start_conversation
      target_id: liam
      intent_id: deep_ask_life
    golden: >
      A real conversation on the terrace. Liam is the grounded sweetheart —
      he answers the deeper question honestly, doesn't perform, and turns the
      question back in a way that respects the player. Imagine: "I think
      about it more than I'd admit. Teaching is small. I want it to mean
      more. ...what about you, why are you really here?"
    checks: *conversation_checks
  - id: close-liam
    action: *end_action
    golden: >
      Memories should capture a chunk of substance — the actual thing Liam
      said about meaning, not "we talked on the terrace".
    checks: *close_checks
  - id: chat-nia
    arrange_player_location: terrace
    arrange_npc_locations:
      nia: terrace
    action:
      kind: start_conversation
      target_id: nia
      intent_id: friendly_compliment_personality
    golden: >
      A genuine personality compliment, returned with grace. Nia is the
      observant warm friend — she notices the compliment is real, smiles,
      and gives back a specific read of how the player treats or affects her.
      Imagine: "That's a kind thing to say. ...Can I tell you what I noticed
      about you, actually?"
    checks: *conversation_checks
  - id: close-nia
    action: *end_action
    golden: >
      Memories should capture Nia's specific read of the player, not a generic
      "we connected".
    checks: *close_checks
  - id: move-bedroom
    arrange_npc_locations:
      sophie: bedroom
      blake: bedroom
    action:
      kind: move
      target_id: bedroom
    golden: >
      The player walks into the bedroom; Sophie and Blake are visible.
    checks:
      - location_is:bedroom
      - visible_targets_include:sophie,blake
  - id: chat-sophie
    arrange_player_location: bedroom
    arrange_npc_locations:
      sophie: bedroom
    action:
      kind: start_conversation
      target_id: sophie
      intent_id: banter_playful_roast
    golden: >
      Playful social sparring in the bedroom doorway. Sophie is the polished
      joker — she takes the roast like it's a serve, returns it sharper, and
      leaves the door open just enough that the player wants to come back.
      Imagine: "Cute. Six out of ten for setup, four for delivery. ...try me
      again later when you've had time to think."
    checks: *conversation_checks
  - id: close-sophie
    action: *end_action
    golden: >
      Memories should capture the specific bit of the roast that landed —
      the line, not a vague "we joked around".
    checks: *close_checks
  - id: chat-blake
    arrange_player_location: bedroom
    arrange_npc_locations:
      blake: bedroom
    action:
      kind: start_conversation
      target_id: blake
      intent_id: bromance_share_strategy
    golden: >
      A quiet read-the-room conversation. Blake is the dry observer — he
      gives a real strategic take in fewer words than expected, drops one
      sharp read of another Heartbreaker, and stops short of gossip. Imagine:
      "I'm watching Maya. Not for me, but she's the one to read this week.
      You should be watching her too."
    checks: *conversation_checks
  - id: close-blake
    action: *end_action
    golden: >
      Memories should capture Blake's specific read — naming the
      Heartbreaker he flagged, not "Blake had thoughts".
    checks: *close_checks
