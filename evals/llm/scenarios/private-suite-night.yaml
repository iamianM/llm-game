id: private-suite-night
title: Paradise Suite (Private Suite)
question: Can the suite reward apply once and narrate the correct romantic beat?
category: special_events
goal: Prove a Day 5 evening Private Suite moves the player and partner into the suite, applies the deterministic relationship reward exactly once, marks the couple as committed, and gives the Event Narrator the Private Suite beat to narrate.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: private_suite_foregrounded
      criteria: >
        The Private Suite remains the dominant, genuinely private beat between only the player
        and Chloe. A later gather or ceremony must not crowd it out, appear first, or place a
        third Heartbreaker inside the suite.
seed: 2020
initial_day: 5
initial_phase: evening
live_resort_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 9
    banter: 6
    eq: 5
    spark: 5
    loyalty: 5
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 80
    chemistry: 70
    trust: 65
    friendship: 30
judge_context:
  - Private Suite is engine-owned. Eligibility is gated on couple strength, day, phase, and once-per-run usage.
  - The engine applies the relationship deltas and records a private_suite event; the LLM only narrates that resolved event.
  - The narrator may mention the wider cast outside the suite, but only the player and Chloe should appear inside the private beat.
turns:
  - id: open-the-suite
    arrange_player_location: flame_deck
    arrange_npc_locations:
      chloe: flame_deck
    action:
      kind: private_suite
    golden:
      criteria: 'The player and Chloe leave the flame_deck and the suite door closes. The narration should
        hold on the privacy of it: softer light, fewer cameras, the cast pretending not to listen. Imagine:
        "He follows her into the suite without saying a word. Outside, the rest of the cast is loud on purpose
        to give them the room." No other Heartbreaker is named inside the suite.'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: You and Chloe slip away from Sunset Bay’s noise and into a private Paradise Suite night,
            with the door closing on the rest of the resort. Chloe’s gaze stays on you as your hands find
            each other, and for one quiet beat, the two of you hold the warmth of being alone together.
    checks:
      - private_suite_consumed:chloe
      - location_is:private_suite
      - relationship_delta:chloe:affection:10
      - relationship_delta:chloe:chemistry:15
      - relationship_delta:chloe:trust:10
      - ceremony_event_present:private_suite
      - event_narration_valid
      - agent_traces_present
