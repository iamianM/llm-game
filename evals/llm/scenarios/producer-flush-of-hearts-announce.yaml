id: producer-flush-announce
title: Producer Text And Flush Of Hearts Announce
question: Can the twist land without deciding who sticks or twists?
category: special_events
goal: Prove the Flush of Hearts twist lands with the right tension — the gather is called, the second-resort entry is described, and the narrator does not pre-decide whether anyone has stuck or twisted yet.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: flush_transition_arc
      criteria: >
        The announcement creates specific tension between the player and Chloe, then the entry
        clearly moves the player into the second resort and frames the original connection as
        the stake. No turn may pre-decide stick/twist, name an unseen arrival, or narrate a return.
seed: 606
initial_day: 4
initial_phase: afternoon
live_resort_life: false
character_creation:
  archetype_id: heartthrob
  gender: man
  stats:
    charm: 9
    banter: 6
    eq: 5
    spark: 5
    loyalty: 5
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 3
initial_relationships:
  chloe:
    affection: 60
    chemistry: 30
    trust: 45
    friendship: 20
judge_context:
  - Flush of Hearts is the major mid-run twist; the cast does not know the new arrivals yet at this point.
  - The narrator preserves the deterministic state transition into the second resort and the original partner being the relationship that gets tested.
  - The narrator must not pre-decide whether the player stays loyal, picks new, or returns single.
turns:
  - id: call-flush-gather
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      criteria: 'The producer text drops and the resort is called to the flame_deck for Flush of Hearts. The
        narrator sets the tension: phones lighting up, the cast clocking each other, the player and Chloe
        sharing a look they can''t read yet. Imagine: "Phones go off at exactly the same second. The cast
        reads it twice. Chloe finds the player''s eye across the pool and neither of them speaks." The twist
        is announced; nothing has resolved.'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The call goes out across Sunset Bay, sending everyone toward the Flame Deck for the Flush
            of Hearts. You move with Chloe, and her hand finds yours for one quiet beat before the resort
            gathers around you.
    checks:
      - ceremony_events_present
      - event_narration_valid
      - pending_gather_waiting
      - agent_traces_present
  - id: enter-flush-of-hearts
    action:
      kind: join_gather
    golden:
      criteria: 'The player walks into the second resort. The narrator establishes the shift in scenery and
        stakes — the original couple separated, the new cast in scope, the player''s relationship with Chloe
        now the thing being tested at a distance. Imagine: "Sunset Bay shrinks in the rear-view. The second
        resort hums with strangers. Somewhere across the water, Chloe is on her own version of this night."'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: The Flush of Hearts text lands, and the resort’s easy rhythm snaps into motion as bags are
            packed for the second resort. You arrive at the Flush of Hearts pool while Chloe remains at Sunset
            Bay, leaving the distance between you to carry the full weight of the moment.
    checks:
      - ceremony_events_present
      - event_narration_present
      - flush_active
      - agent_traces_present
