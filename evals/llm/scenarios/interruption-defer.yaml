id: interruption-defer
title: Conversation Interruption (Defer)
question: Can deferring an interruption preserve the active conversation?
category: social_dynamics
goal: 'Prove an NPC interruption mid-conversation routes through the engine cleanly: the player picks "defer", the engine resolves the chance, the pending interruption clears, and the original conversation stays active.'
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: defer_preserves_original_conversation
      criteria: >
        The turn must remain engine-only. It clears Liam's interruption, leaves Chloe as the active
        conversation, and applies the recorded affection change to Liam. Any dialogue, narration,
        memory, menu, claim that Liam accepted the delay gracefully, or switch to Liam fails the beat.
seed: 1919
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  chloe:
    affection: 50
    chemistry: 20
    trust: 35
    friendship: 20
  liam:
    affection: 35
    trust: 25
    friendship: 25
judge_context:
  - The player is mid-conversation with Chloe at the pool; Liam walks up with a polite interruption.
  - The engine decides whether a deferral lands well based on stats and affection.
  - Defer and ignore are engine-only interruption responses because they keep the original conversation in place. Accept is the path that starts a new voiced exchange.
turns:
  - id: defer-liam
    arrange_player_location: pool
    arrange_npc_locations:
      chloe: pool
      liam: pool
    arrange_active_conversation:
      target_id: chloe
      started_on_turn: 0
      started_on_day: 1
      pending_interruption:
        interrupter_id: liam
        reason: needs_to_talk
        urgency: polite
    action:
      kind: respond_with
      target_id: liam
      intent_id: defer_interruption
    golden:
      calls: []
    checks:
      - interruption_cleared
      - active_conversation_target_is:chloe
      - relationship_delta:liam:affection:-1
      - no_exchange
