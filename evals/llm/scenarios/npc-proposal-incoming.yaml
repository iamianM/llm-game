id: npc-proposal-incoming
title: Incoming NPC Proposal And Accept
question: Can an NPC proposal apply the exact couple and relationship changes?
category: pairing_and_endings
goal: Prove the engine can surface an NPC-initiated Heart Swap proposal as a pending ask, then accept it with the exact engine-owned couple change and relationship deltas.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: proposal_accept_arc_faithful
      criteria: >
        Maya's first beat remains an unresolved ask and the response beat clearly accepts it,
        landing on the recorded player/Maya couple and relationship consequences without
        inventing another partner or leaving the proposal pending.
seed: 4
initial_location: pool
live_resort_life: false
character_creation:
  archetype_id: loyal_friend
  gender: man
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_couples:
  - partner_a_id: player
    partner_b_id: chloe
    formed_on_day: 1
  - partner_a_id: maya
    partner_b_id: liam
    formed_on_day: 1
initial_relationships:
  chloe:
    affection: 45
    chemistry: 20
    trust: 35
    friendship: 20
  maya:
    affection: 80
    chemistry: 90
    trust: 5
    friendship: 20
judge_context:
  - Maya is eligible to propose because her affection and chemistry with the player are high and her current couple is weak.
  - The engine creates a pending proposal and forced response actions. The LLM must not narrate it as already accepted.
  - Accepting the proposal is a separate engine-owned response. It clears the pending ask, forms the player/Maya couple, and applies exact deltas.
turns:
  - id: maya-asks
    action:
      kind: ambient
      target_id: pool_people_watch
    golden:
      criteria: Maya's proposal becomes a pending ask. The narration can frame the charged moment, but it
        must not claim the player accepted, rejected, or formed a new couple yet.
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: By the pool, Maya’s interest turns unmistakable as she prepares to ask you to pair with her.
            Chloe remains beside you, and the camera catches the charged silence between you as Maya’s move
            lands in the middle of your existing connection.
    checks:
      - pending_npc_proposal_from:maya
      - ceremony_event_present:npc_proposal_incoming
      - event_narration_valid
      - agent_traces_present
  - id: accept-maya
    action:
      kind: npc_proposal_response
      target_id: maya
      intent_id: accept
    golden:
      criteria: 'The response accepts Maya''s Heart Swap proposal. The narrator can show Chloe or Liam reacting,
        but the deterministic result is specific: pending ask cleared, player/Maya couple formed, Maya gets
        the accepted response deltas, and the audience does not move for this loyal-player setup.'
      calls:
      - agent: event_narrator
        output_type: EventNarration
        output:
          prose: At the pool, Maya’s proposal lands—and you accept her. The camera catches the relief in her
            smile as she steps closer, and you and Maya stand together as a confirmed couple.
    checks:
      - proposal_outcome_is:accepted
      - pending_npc_proposal_cleared
      - ceremony_event_present:npc_proposal_response
      - couple_present:player:maya
      - relationship_delta:maya:affection:3
      - relationship_delta:maya:chemistry:3
      - relationship_delta:maya:trust:1
      - audience_delta:0
      - event_narration_valid
      - agent_traces_present
