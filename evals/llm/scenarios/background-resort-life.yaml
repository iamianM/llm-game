id: background-resort-life
title: Background Resort Life
goal: Prove the Resort Orchestrator, Background Dialogue, and Background Curator can move the resort forward without polluting the player's first-person memory rail or rewriting deterministic state.
seed: 1818
initial_location: pool
live_resort_life: true
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  chloe:
    affection: 30
    trust: 15
initial_npc_conversations:
  - id: npcconv_maya_marcus_kitchen
    participants:
      - maya
      - marcus
    location_id: kitchen
    topic: Maya pressing Marcus about who he is actually watching this week
    started_on_turn: 0
    status: active
judge_context:
  - The resort keeps moving while the player just sits by the pool — orchestrator may continue the kitchen chat, propose another, move someone, or do nothing.
  - Background curator emits batches with kind="background"; those must not write a `direct` memory for the player. Witnessed-only is allowed if the player is a bystander.
  - The orchestrator does not get to mutate engine state directly; it returns a structured ResortUpdate and the engine applies it.
turns:
  - id: idle-at-pool
    arrange_player_location: pool
    action:
      kind: ambient
      target_id: ambient_wait
    golden: >
      The player takes a minute by the pool. The resort orchestrator may
      continue the Maya-Marcus chat in the kitchen, surface another beat
      elsewhere, or leave things alone. Whatever it does must come back as
      a typed ResortUpdate; any new dialogue must stay in the two NPCs'
      voices; any memories it produces must be flagged background so the
      player rail doesn't grow with stuff she didn't see.
    checks:
      - resort_update_committed
      - background_kind_isolated
      - agent_traces_present
      - no_agent_validation_retries
    judge_checks:
      - id: background_voice_distinct
        criteria: >
          Any background dialogue captured for this turn reads in the two
          named NPCs' voices (not as narrator exposition, not as if the
          player were present). Skip with cannot_determine if no background
          dialogue was produced.
      - id: orchestrator_grounded
        criteria: >
          The resort update reflects the current resort state (locations,
          existing NPC conversations, mood); it should not propose
          impossible movements (e.g., starting a conversation with an
          eliminated Heartbreaker) or contradict the deterministic facts
          already on the board.
