id: background-resort-life
title: Background Resort Life
question: Can unseen resort activity continue without corrupting player memory or game state?
category: social_dynamics
goal: Prove the Resort Orchestrator, Background Dialogue, and Background Curator can move the resort forward without polluting the player's first-person memory rail or rewriting deterministic state.
thread_check:
  id: thread_acceptance
  severity: blocking
  criteria:
    - id: background_life_grounded
      criteria: >
        Each background exchange must use the exact participant ids, location, and topic selected
        in its matching ResortUpdate. The two speakers answer each other in distinct voices, and
        the continued Maya and Marcus exchange advances their existing question. Fail repeated
        dialogue patterns, biography dumps, a speaker addressing a bystander instead of their
        partner, or any claim that the player heard an off-screen exchange. Background memories
        must never become the player's direct memory.
seed: 1818
initial_location: pool
live_resort_life: true
character_creation:
  archetype_id: loyal_friend
  gender: woman
  stats:
    charm: 5
    banter: 6
    eq: 5
    spark: 5
    loyalty: 9
initial_relationships:
  chloe:
    affection: 30
    trust: 15
initial_npc_conversations:
  - id: npcconv_maya_marcus_kitchen
    participants:
      - maya
      - marcus
    location_id: kitchen
    topic: Maya pressing Marcus about who he is actually watching this week
    started_on_turn: 0
    status: active
judge_context:
  - The resort keeps moving while the player sits by the pool. The orchestrator may continue the kitchen chat, propose another, move someone, or do nothing.
  - Background curator emits batches with kind="background"; those must not write a `direct` memory for the player. Witnessed-only is allowed if the player is a bystander.
  - The orchestrator does not get to mutate engine state directly; it returns a structured ResortUpdate and the engine applies it.
turns:
  - id: idle-at-pool
    arrange_player_location: pool
    action:
      kind: ambient
      target_id: ambient_wait
    golden:
      calls:
      - agent: resort_orchestrator
        output_type: ResortUpdate
        criteria:
          - Return only legal movements and conversation changes grounded in the supplied resort state.
          - A continued conversation must use its existing conversation id; a new conversation must use available participants at the selected location.
          - The update may start, continue, move, or leave the resort unchanged. Do not require the reviewed example's cast pairing.
      - agent: background_dialogue
        output_type: BackgroundExchange
        criteria:
          - Apply these criteria to every actual Background Dialogue call produced by the ResortUpdate, even when there is more than one.
          - Each call must use the exact participants, location, topic, or continuation nudge selected in the actual ResortUpdate.
          - The speakers answer each other in distinct voices without biography dumps, invented bystanders, or claims that the player heard the off-screen exchange.
          - A continued Maya and Marcus exchange advances their existing question instead of restarting it.
    checks:
      - resort_update_committed
      - background_kind_isolated
      - agent_traces_present
