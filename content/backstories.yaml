backstories:
  chloe: "Twenty-six, primary school teacher from Liverpool. She lives with her pregnant older sister and spends most evenings marking work at their kitchen table."
  maya: "Twenty-four, marketing executive from Bristol. She works for a sustainable fashion brand and captains a competitive pub quiz team."
  liam: "Twenty-seven, paramedic from Galway. He is calm on difficult shifts, cooks when he cannot sleep, and is usually the person friends call first."
  sophie: "Twenty-eight, luxury events producer from London. She likes a plan, notices poor timing immediately, and takes pride in making complicated days look easy."
  nia: "Twenty-five, florist from Birmingham. She runs a small shop with her aunt and remembers which flowers regular customers buy for important dates."
  marcus: "Twenty-nine, sales lead at a Manchester logistics startup. He is practical, competitive, and usually volunteers to sort out the problem nobody else wants."
  blake: "Twenty-six, radio producer from York. He works behind the scenes on a late-night music show and keeps a running list of songs other people recommend."
  jordan: "Twenty-five, cocktail bartender from Cardiff. He is quick with customers, good at reading a busy room, and happiest when a group has found its rhythm."
  aisha: "Twenty-five, nightlife promoter from London. Aisha has made a career out of reading rooms fast and leaving before anyone gets too comfortable. She came in as a Heart Throb because stability bores her until it proves it can survive her."
  beau: "Twenty-seven, cocktail bar owner from Bristol. Beau is smooth with strangers and private with friends. He is testing whether the player wants excitement or just reassurance."
  jules: "Twenty-four, trainee paramedic from Sheffield. Jules is sweet under pressure and awkward when he has to sell himself. He notices kindness quickly and remembers dismissiveness longer."
  mateo: "Twenty-eight, personal trainer from Manchester. Mateo knows exactly how he looks and is tired of people assuming that is all there is. He talks about his nephew when he trusts someone."
  sasha: "Twenty-five, fashion buyer from London. Sasha has a sharp eye for insecurity and a softer side she hides behind jokes. She likes people who can keep up without performing."
  zara: "Twenty-six, club promoter from Essex. Zara treats flirting like a chessboard and hates predictable moves. She wants someone bold enough to surprise her without trying to manage her."
  noor: "Twenty-three, graduate student from Nottingham. Noor is observant, warm, and more strategic than she first appears. She listens for what people avoid saying."
